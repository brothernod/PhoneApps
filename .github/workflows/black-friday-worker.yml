name: Deploy Black Friday worker

# Run it by hand from the Actions tab (works in the GitHub app too).
# After the first setup, changes under black-friday/worker/ deploy on their own.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["black-friday/worker/**"]

concurrency: black-friday-worker

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check the secrets are set
        id: check
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KEY: ${{ secrets.BF_LIST_KEY }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ] && [ -n "$KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Add CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and BF_LIST_KEY under Settings > Secrets and variables > Actions, then run this workflow again."
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 22

      - name: Deploy the Worker
        if: steps.check.outputs.ready == 'true'
        working-directory: black-friday/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.166.0 deploy 2>&1 | tee deploy.log

      - name: Set the list key
        if: steps.check.outputs.ready == 'true'
        working-directory: black-friday/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LIST_KEY: ${{ secrets.BF_LIST_KEY }}
        run: printf '%s' "$LIST_KEY" | npx --yes wrangler@4.166.0 secret put LIST_KEY

      - name: Show the Worker address
        if: steps.check.outputs.ready == 'true'
        working-directory: black-friday/worker
        run: |
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "Worker address: ${URL:-see the Deploy step log}"
          {
            echo "### Black Friday worker is live"
            echo ""
            echo "Worker address: \`${URL:-see the Deploy step log}\`"
            echo ""
            echo "Open https://brothernod.github.io/PhoneApps/black-friday/ on your phone, tap **First-time setup**, and enter this address and your BF_LIST_KEY."
          } >> "$GITHUB_STEP_SUMMARY"
