<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Inky">
<meta name="theme-color" content="#2db5d1">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="An octopus reading game: bonk letter blocks to sound out three-letter words, pick the matching picture, and collect sea friends.">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>[hidden]{display:none!important}img{max-width:100%}</style>
<title>Inky's Word Reef</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Lilita+One&family=Playwrite+US+Trad:wght@400&display=swap">
<style>
/* Layout: one full-screen sea "stage"; screens stack as layers; Montessori letter colors (pink consonants, blue vowels) carry the reading content. */
:root {
  color-scheme: light;
  --ink: #15304d; --ink-2: #3c5c7e; --foam: #ffffff; --panel: #fffdf7;
  --cons: #e0457f; --cons-bg: #ffe4ee; --cons-edge: #f3a9c6;
  --vow: #2560d8; --vow-bg: #e2ecff; --vow-edge: #a7c2f5;
  --gold: #ffc93c; --gold-2: #e6950b; --gold-3: #fff1b8;
  --good: #23a565; --coral: #ff7a6b;
  --o1: #8e4fe0; --o2: #6b31c2; --o3: #c7a2ff;
  --w1: #7fe3ee; --w2: #2bb3d0; --w3: #1786b0; --floor: #f2d08a; --floor2: #e2b867; --plant: #2fa36b;
  --display: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  --read: "Andika", "Century Gothic", "Avenir Next", system-ui, sans-serif;
  --letters: var(--read);
  --emoji: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
  --blk: clamp(64px, 16vmin, 150px); --bub: clamp(84px, 19vmin, 172px);
  --iw: clamp(104px, 22vmin, 205px); --tile: clamp(58px, 12.5vmin, 116px);
}
html { height: 100%; box-sizing: border-box; }
body { height: 100%; margin: 0; overflow: hidden; background: var(--w3); color: var(--ink); font-family: var(--read);
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
body.cursive { --letters: "Playwrite US Trad", "Andika", cursive; }
*, *::before, *::after { box-sizing: border-box; }
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; touch-action: manipulation; }
button:focus-visible, input:focus-visible { outline: 4px solid var(--gold); outline-offset: 3px; }
.emo { font-family: var(--emoji); line-height: 1; font-style: normal; }

/* ---------- the sea ---------- */
#app { position: fixed; inset: 0; overflow: hidden; touch-action: manipulation; background: linear-gradient(180deg, var(--w1) 0%, var(--w2) 55%, var(--w3) 100%); transition: background .6s; }
.th-sand { --w1:#86e6ef; --w2:#2db5d1; --w3:#1584ae; --floor:#f3d28c; --floor2:#e0b464; --plant:#2fa36b; }
.th-kelp { --w1:#97e8c9; --w2:#29a58c; --w3:#0f6f66; --floor:#cdbf86; --floor2:#a79a5e; --plant:#1b7f45; }
.th-coral { --w1:#ffc1db; --w2:#c884dc; --w3:#6a4cc0; --floor:#ffd9ad; --floor2:#efb178; --plant:#ff6f91; }
.th-ship { --w1:#78bdea; --w2:#2f6fb0; --w3:#183a72; --floor:#cfb993; --floor2:#a58e68; --plant:#3c9a80; }
.th-volcano { --w1:#86d6d9; --w2:#2b7d9b; --w3:#1f3b57; --floor:#6a5568; --floor2:#46344b; --plant:#ff8a3d; }
.th-deep { --w1:#22558f; --w2:#14315f; --w3:#091632; --floor:#26406a; --floor2:#172a4f; --plant:#4be3d6; }
.rays { position: absolute; inset: -30% -20% auto; height: 90%; pointer-events: none; opacity: .55;
  background: repeating-linear-gradient(104deg, rgba(255,255,255,.16) 0 5%, transparent 5% 13%); filter: blur(8px); animation: rays 14s ease-in-out infinite alternate; }
@keyframes rays { to { transform: translateX(8%) skewX(-4deg); } }
.floor { position: absolute; left: 0; right: 0; bottom: 0; height: 22%; width: 100%; pointer-events: none; }
.floor .s1 { fill: var(--floor2); } .floor .s2 { fill: var(--floor); }
.weed { position: absolute; bottom: 8%; width: 46px; transform-origin: 50% 100%; animation: sway 4.5s ease-in-out infinite alternate; pointer-events: none; }
.weed path { fill: none; stroke: var(--plant); stroke-width: 9; stroke-linecap: round; }
@keyframes sway { from { transform: rotate(-5deg); } to { transform: rotate(6deg); } }
.prop { position: absolute; bottom: 4%; font-size: clamp(26px, 5vmin, 54px); pointer-events: none; filter: saturate(.9); }
.bubl { position: absolute; bottom: -40px; border-radius: 50%; border: 2px solid rgba(255,255,255,.7); background: radial-gradient(circle at 30% 30%, rgba(255,255,255,.7), rgba(255,255,255,.08) 60%);
  animation: rise linear infinite; pointer-events: none; }
@keyframes rise { to { transform: translate(var(--dx, 20px), -115vh); } }
.th-deep .glow { position: absolute; width: 6px; height: 6px; border-radius: 50%; background: #9ff9ff; box-shadow: 0 0 12px 4px #4be3d6; animation: twinkle 3s ease-in-out infinite alternate; }
@keyframes twinkle { from { opacity: .2; } to { opacity: 1; } }

/* ---------- screens ---------- */
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; padding-block: max(12px, env(safe-area-inset-top, 0px)) max(14px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.topbar { display: flex; align-items: center; gap: 12px; min-height: 60px; position: relative; z-index: 5; }
.topbar .grow { flex: 1; min-width: 0; }
.ibtn { width: 58px; height: 58px; border-radius: 50%; background: var(--panel); display: grid; place-items: center; flex: none;
  box-shadow: 0 5px 0 rgba(21,48,77,.25); transition: transform .1s; }
.ibtn:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(21,48,77,.25); }
.ibtn svg { width: 30px; height: 30px; fill: none; stroke: var(--ink); stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
.coins { display: flex; align-items: center; gap: 8px; background: var(--panel); border-radius: 999px; padding: 6px 16px 6px 8px;
  font-family: var(--display); font-size: 26px; box-shadow: 0 5px 0 rgba(21,48,77,.25); font-variant-numeric: tabular-nums; }
.coin { width: 34px; height: 34px; border-radius: 50%; flex: none; background: radial-gradient(circle at 35% 30%, #fff6c9 0 18%, var(--gold) 19% 62%, var(--gold-2) 63%);
  box-shadow: inset 0 0 0 3px var(--gold-2); }
.coins.bump { animation: bump .3s; }
@keyframes bump { 50% { transform: scale(1.15); } }
.big-btn { font-family: var(--display); font-size: clamp(28px, 6vmin, 46px); color: var(--ink); background: linear-gradient(180deg, #ffe07a, var(--gold));
  border-radius: 999px; padding: .35em 1.1em .4em; box-shadow: 0 8px 0 var(--gold-2), 0 14px 24px rgba(0,0,0,.2); transition: transform .1s; display: inline-flex; align-items: center; gap: .4em; }
.big-btn:active { transform: translateY(5px); box-shadow: 0 3px 0 var(--gold-2); }
.big-btn svg { width: 1em; height: 1em; fill: var(--ink); }
.label { font-family: var(--display); color: #fff; letter-spacing: .02em; text-shadow: 0 3px 0 rgba(21,48,77,.6), 0 0 16px rgba(21,48,77,.45); }

/* ---------- Inky ---------- */
.octo-wrap { position: relative; width: var(--iw); aspect-ratio: 200 / 210; max-width: 100%; }
.octo { width: 100%; height: 100%; overflow: visible; display: block; }
.octo .o-h, .octo .o-sp { fill: var(--o1); } .octo .t { fill: none; stroke: var(--o1); stroke-width: 19; stroke-linecap: round; }
.octo .t2 { fill: none; stroke: var(--o3); stroke-width: 5; stroke-linecap: round; stroke-dasharray: 0.1 13; opacity: .9; }
.octo .o-dot { fill: var(--o3); opacity: .75; } .octo .o-sh { fill: #fff; opacity: .35; }
.octo .eye { fill: #fff; } .octo .pup { fill: var(--ink); } .octo .cheek { fill: #ff8fb8; opacity: .7; }
.octo .mouth { fill: none; stroke: var(--ink); stroke-width: 4.5; stroke-linecap: round; }
.octo .mouth-o { fill: #7a1f3d; stroke: var(--ink); stroke-width: 4; opacity: 0; }
.octo .tg { animation: wig 2.6s ease-in-out infinite alternate; }
.octo .tg:nth-child(2n) { animation-duration: 2.1s; animation-delay: -.7s; }
.octo .tg:nth-child(3n) { animation-duration: 3s; animation-delay: -1.3s; }
@keyframes wig { from { transform: rotate(-7deg); } to { transform: rotate(7deg); } }
.octo .eyes { transform-origin: 100px 90px; animation: blink 4.6s infinite; }
@keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.08); } }
.octo-wrap.happy .mouth { opacity: 0; } .octo-wrap.happy .mouth-o { opacity: 1; }
.octo-wrap.sleep .eyes { animation: none; transform: scaleY(.08); }
.octo-wrap.rainbow .octo { animation: hue 3s linear infinite; }
@keyframes hue { to { filter: hue-rotate(360deg); } }
.octo-wrap .hat { position: absolute; left: 50%; top: -15%; transform: translateX(-50%) rotate(-8deg); font-size: calc(var(--iw) * .4); pointer-events: none; }
.octo-wrap .hat.eyes { top: 26%; font-size: calc(var(--iw) * .42); transform: translateX(-50%); }
.octo-wrap .hat.side { left: 72%; top: -6%; font-size: calc(var(--iw) * .3); transform: rotate(14deg); }
.idle { animation: bob 2.6s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-7px); } }

/* ---------- title ---------- */
#title { align-items: center; justify-content: space-between; text-align: center; }
#title .logo { margin-top: 2vh; }
#title .logo small { display: block; font-size: clamp(22px, 4.5vmin, 40px); color: var(--ink); text-shadow: 0 2px 0 rgba(255,255,255,.55); }
#title .logo b { display: block; font-size: clamp(48px, 12vmin, 118px); line-height: .9; font-weight: 400;
  -webkit-text-stroke: 0; color: #fff; text-shadow: 0 5px 0 var(--o2), 0 10px 0 rgba(21,48,77,.3); }
#title .logo .sub { font-family: var(--read); font-weight: 700; font-size: clamp(15px, 2.6vmin, 22px); text-shadow: none; color: var(--ink); background: rgba(255,255,255,.8); display: inline-block; padding: 4px 14px; border-radius: 999px; margin-top: 12px; }
#title .hero { --iw: clamp(150px, 30vmin, 300px); }
#title .row { display: flex; gap: 14px; align-items: center; justify-content: center; flex-wrap: wrap; }
.pill-btn { display: flex; align-items: center; gap: 10px; background: var(--panel); border-radius: 999px; padding: 8px 18px 8px 10px; font-family: var(--display); font-size: 22px;
  box-shadow: 0 5px 0 rgba(21,48,77,.25); }
.pill-btn .emo { font-size: 34px; }
.pill-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(21,48,77,.25); }
.today { display: flex; align-items: center; gap: 6px; background: rgba(255,255,255,.85); border-radius: 999px; padding: 6px 14px; font-weight: 700; font-size: 15px; }
.today i { width: 22px; height: 22px; display: inline-block; clip-path: polygon(50% 0, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); background: rgba(21,48,77,.2); }
.today i.on { background: var(--gold-2); }
.grownup { position: relative; isolation: isolate; flex: none; font-size: 14px; font-weight: 700; color: var(--ink); background: rgba(255,255,255,.75);
  border-radius: 999px; padding: 9px 14px; overflow: hidden; }
.grownup .fill { position: absolute; inset: 0; background: var(--gold); transform-origin: left; transform: scaleX(0); z-index: -1; }
.grownup.holding .fill { transition: transform 2s linear; transform: scaleX(1); }

/* ---------- map ---------- */
#map .wname { font-size: clamp(26px, 5.5vmin, 44px); text-align: center; }
.mapzone { flex: 1; position: relative; min-height: 0; }
.mapzone svg.path { position: absolute; inset: 0; width: 100%; height: 100%; }
.mapzone svg.path path { fill: none; stroke: rgba(255,255,255,.75); stroke-width: 7; stroke-dasharray: 2 18; stroke-linecap: round; }
.node { position: absolute; width: clamp(78px, 15vmin, 132px); aspect-ratio: 1; transform: translate(-50%, -50%); border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #fff 0 12%, #ffe9a8 13% 55%, var(--gold) 56%); box-shadow: 0 7px 0 var(--gold-2), 0 12px 22px rgba(0,0,0,.25);
  display: grid; place-items: center; font-family: var(--display); font-size: clamp(30px, 6vmin, 52px); color: var(--ink); }
.node.locked { background: radial-gradient(circle at 35% 30%, #fff 0 10%, #d9e4ee 11% 60%, #b6c6d6 61%); box-shadow: 0 7px 0 #8ea3b8; color: #7c90a6; }
.node.locked svg { width: 42%; height: 42%; fill: none; stroke: #7c90a6; stroke-width: 3.5; stroke-linecap: round; }
.node.done::after { content: ""; position: absolute; right: -4%; top: -4%; width: 38%; height: 38%; background: var(--good); border-radius: 50%; border: 4px solid #fff;
  -webkit-mask: none; }
.node.done::before { content: ""; position: absolute; right: 6%; top: 4%; width: 13%; height: 22%; border: solid #fff; border-width: 0 5px 5px 0; transform: rotate(40deg); z-index: 2; }
.node.boss { width: clamp(96px, 19vmin, 160px); }
.node.boss .emo { font-size: .95em; }
.node.current { animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 7px 0 var(--gold-2), 0 0 0 14px rgba(255,255,255,.35); } }
.mapzone .octo-wrap { position: absolute; --iw: clamp(70px, 13vmin, 120px); translate: -50% -100%; pointer-events: none; transition: left .5s, top .5s; }
.arrow { position: absolute; top: 50%; transform: translateY(-50%); z-index: 3; }
.arrow.l { left: 0; } .arrow.r { right: 0; }
.wdots { display: flex; gap: 8px; justify-content: center; }
.wdots i { width: 12px; height: 12px; border-radius: 50%; background: rgba(255,255,255,.4); } .wdots i.on { background: #fff; }

/* ---------- play ---------- */
#stage { flex: 1; position: relative; min-height: 0; }
.pearls { display: flex; gap: 10px; justify-content: center; }
.pearls i { width: 20px; height: 20px; border-radius: 50%; background: rgba(255,255,255,.3); border: 3px solid rgba(255,255,255,.7); }
.pearls i.on { background: radial-gradient(circle at 35% 30%, #fff 0 25%, #f3e9ff 26% 60%, #d6c4f2 61%); border-color: #fff; }
.pearls i.now { animation: bump 1s infinite; border-color: var(--gold); }
.blocks { position: absolute; left: 50%; top: 3%; transform: translateX(-50%); display: flex; gap: clamp(10px, 2.4vmin, 24px); align-items: flex-end; z-index: 2; }
.blk { width: var(--blk); height: var(--blk); border-radius: 22%; display: grid; place-items: center; position: relative; background: var(--cons-bg);
  box-shadow: inset 0 -0.09em 0 var(--cons-edge), 0 8px 0 rgba(21,48,77,.28); font-family: var(--letters); font-weight: 700; color: var(--cons);
  font-size: calc(var(--blk) * .62); line-height: 1; transition: transform .15s, filter .2s; }
.blk span { transform: translateY(-4%); }
body.cursive .blk { font-weight: 400; font-size: calc(var(--blk) * .5); }
.blk.v { background: var(--vow-bg); color: var(--vow); box-shadow: inset 0 -0.09em 0 var(--vow-edge), 0 8px 0 rgba(21,48,77,.28); }
.blk.dim { filter: saturate(.55) brightness(.92); opacity: .8; }
.blk.next { animation: nudge 1.1s ease-in-out infinite; outline: 5px solid var(--gold); outline-offset: 3px; }
@keyframes nudge { 50% { transform: translateY(-8px); } }
.blk.lit { outline: 4px solid #fff; outline-offset: 2px; }
.blk.flash { transform: translateY(-10px) scale(1.06); filter: brightness(1.1); outline: 5px solid var(--gold); }
.blk.hit { animation: hit .32s; }
@keyframes hit { 30% { transform: translateY(-22px); } 60% { transform: translateY(4px); } }
.blk.slot { background: rgba(255,255,255,.35); box-shadow: inset 0 0 0 4px rgba(255,255,255,.85); color: transparent; }
.blk.slot.next { outline-style: dashed; }
.pop-coin { position: absolute; width: 40px; height: 40px; pointer-events: none; z-index: 70; }
.chest .gold { opacity: 0; transition: opacity .3s .2s; } .chest.open .gold { opacity: 1; }
#inky { position: absolute; left: 0; top: 0; z-index: 3; will-change: transform; }
.say { position: absolute; z-index: 4; background: #fff; border-radius: 26px; padding: 10px 16px; font-family: var(--display); font-size: clamp(20px, 3.6vmin, 30px);
  box-shadow: 0 6px 0 rgba(21,48,77,.2); display: flex; align-items: center; gap: 8px; animation: bump 1s ease-in-out infinite; white-space: nowrap; }
.say svg { width: 1.2em; height: 1.2em; fill: none; stroke: var(--ink); stroke-width: 2.5; stroke-linecap: round; }
.loot { position: absolute; left: 0; right: 0; bottom: 1%; height: 18%; pointer-events: none; z-index: 1; }
.loot .emo { position: absolute; bottom: 0; font-size: clamp(30px, 6.5vmin, 62px); animation: land .5s ease-out; }
@keyframes land { 0% { transform: translateY(-40px) scale(.6); } 70% { transform: translateY(4px) scale(1.08); } 100% { transform: none; } }
.tray { display: flex; justify-content: center; align-items: center; gap: clamp(12px, 3vmin, 32px); min-height: calc(var(--bub) + 16px); position: relative; z-index: 4; flex-wrap: wrap; }
.bub { width: var(--bub); height: var(--bub); border-radius: 50%; display: grid; place-items: center; position: relative;
  background: radial-gradient(circle at 32% 28%, rgba(255,255,255,.95) 0 9%, rgba(255,255,255,.55) 10% 30%, rgba(255,255,255,.28) 62%, rgba(255,255,255,.5) 100%);
  box-shadow: inset 0 0 0 4px rgba(255,255,255,.8), 0 10px 20px rgba(9,40,70,.25); animation: floatin .55s backwards, drift 3.2s ease-in-out infinite alternate .55s; }
.bub .emo { font-size: calc(var(--bub) * .54); }
.bub:nth-child(2) { animation-delay: .12s, .9s; } .bub:nth-child(3) { animation-delay: .24s, 1.3s; }
@keyframes floatin { from { transform: translateY(60px) scale(.4); opacity: 0; } }
@keyframes drift { to { transform: translateY(-9px); } }
.bub.away { animation: away .6s forwards; pointer-events: none; }
@keyframes away { 30% { transform: translateX(-12px) rotate(-8deg); } 60% { transform: translateX(12px) rotate(8deg); } 100% { transform: translateY(-50px) scale(.5); opacity: 0; } }
.bub.popd { animation: popd .35s forwards; pointer-events: none; }
@keyframes popd { 60% { transform: scale(1.25); opacity: .9; } 100% { transform: scale(1.5); opacity: 0; } }
.combo { position: relative; width: 100%; height: 100%; }
.combo .cb, .combo .ca { position: absolute; left: 50%; transform: translateX(-50%); }
.combo .cb { bottom: 14%; font-size: calc(var(--bub) * .5); z-index: 2; }
.combo .ca { font-size: calc(var(--bub) * .33); }
.combo.on .ca { bottom: 52%; z-index: 3; } .combo.in .ca { bottom: 34%; z-index: 1; }
.tile { width: var(--tile); height: var(--tile); border-radius: 20%; display: grid; place-items: center; background: var(--cons-bg); color: var(--cons);
  font-family: var(--letters); font-weight: 700; font-size: calc(var(--tile) * .62); box-shadow: inset 0 -6px 0 var(--cons-edge), 0 7px 0 rgba(21,48,77,.28); animation: floatin .45s backwards; }
body.cursive .tile { font-weight: 400; font-size: calc(var(--tile) * .48); }
.tile.v { background: var(--vow-bg); color: var(--vow); box-shadow: inset 0 -6px 0 var(--vow-edge), 0 7px 0 rgba(21,48,77,.28); }
.tile.used { visibility: hidden; }
.tile.no { animation: no .4s; } @keyframes no { 25% { transform: translateX(-10px) rotate(-6deg); } 75% { transform: translateX(10px) rotate(6deg); } }
.tile.hint { outline: 5px solid var(--gold); outline-offset: 3px; animation: nudge 1s infinite; }
.target { width: calc(var(--blk) * 1.15); height: calc(var(--blk) * 1.15); }
.target .emo { font-size: calc(var(--blk) * .7); }
.plats { position: absolute; left: 50%; top: 46%; transform: translateX(-50%); display: flex; gap: clamp(10px, 2.6vmin, 26px); align-items: flex-end; z-index: 2; }
.plat { font-family: var(--letters); font-weight: 700; font-size: calc(var(--blk) * .5); padding: .12em .32em .2em; border-radius: 18px; background: #fff;
  box-shadow: 0 8px 0 rgba(21,48,77,.28); white-space: nowrap; letter-spacing: .02em; }
body.cursive .plat { font-weight: 400; font-size: calc(var(--blk) * .4); }
.plat .c { color: var(--cons); } .plat .v { color: var(--vow); } .plat .p { color: var(--ink); }
.plat.next { outline: 5px solid var(--gold); outline-offset: 3px; animation: nudge 1.1s infinite; }
.plat.lit { background: #fff6cf; }
.plat .c.glow, .plat .v.glow { text-shadow: 0 0 12px var(--gold), 0 0 2px var(--gold); }
.snail { position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(var(--bub) + 44px + env(safe-area-inset-bottom, 0px)); z-index: 6; width: 66px; height: 66px; font-size: 40px; }
.hand { position: absolute; z-index: 30; font-size: 54px; pointer-events: none; animation: point .9s ease-in-out infinite; }
@keyframes point { 50% { transform: translateY(14px); } }
.fx { position: absolute; pointer-events: none; z-index: 25; font-size: 40px; }
.puff { position: absolute; right: 2%; top: 38%; width: clamp(120px, 24vmin, 230px); aspect-ratio: 1; z-index: 2; transition: transform .6s cubic-bezier(.3,1.6,.5,1); }
.puff svg { width: 100%; height: 100%; overflow: visible; }

/* ---------- overlays ---------- */

  const bubs = choices(shuffle([[s.a, s.rel, s.b], ...s.alts]).map(([a, rel, b]) => ({ k: `${a}-${rel}-${b}`, html: `<div class="combo ${rel}"><span class="ca emo">${WORDS[a]}</span><span class="cb emo">${WORDS[b]}</span></div>` })));
  if (LV.which < 1) { LV.which++; Snd.voice('l_pic'); }
  const { b, first } = await pickRight(bubs, right, id => sentSounds(P, id));
  stat(s.a, first); stat(s.b, first);
  Snd.pop(); b.classList.add('popd'); toLoot(WORDS[s.a], b); toLoot(WORDS[s.b], b); addCoins(3, b);
  await speak('s_' + sid); react('yay');
  await wait(200); await speak(praiseKey()); await wait(300);
  LV.sent = false;
}

/* --- boss: Grumpy Puff --- */
function puffSVG() {
  let sp = '';
  for (let i = 0; i < 16; i++) {
    const a = i / 16 * Math.PI * 2, p = (r, d) => `${(100 + Math.cos(a + d) * r).toFixed(1)} ${(100 + Math.sin(a + d) * r).toFixed(1)}`;
    sp += `M${p(70, -0.13)} L${p(93, 0)} L${p(70, 0.13)}Z`;
  }
  return `<svg viewBox="0 0 200 200" aria-hidden="true"><path d="${sp}" fill="#e8951c"/><path d="M166 100 l26 -20 v40z" fill="#e8951c"/><circle cx="100" cy="100" r="74" fill="#ffcf4a"/>
<ellipse cx="100" cy="132" rx="46" ry="24" fill="#fff3c4"/><circle cx="76" cy="88" r="15" fill="#fff"/><circle cx="124" cy="88" r="15" fill="#fff"/><circle cx="78" cy="92" r="7" fill="#15304d"/><circle cx="122" cy="92" r="7" fill="#15304d"/>
<path class="pf-brow" d="M58 66 L92 78 M142 66 L108 78" stroke="#15304d" stroke-width="7" stroke-linecap="round" fill="none"/>
<path class="pf-mouth" d="M84 130 Q100 118 116 130" fill="none" stroke="#15304d" stroke-width="6" stroke-linecap="round"/></svg>`;
}
function mountPuff() { const p = h('div', 'puff'); p.innerHTML = puffSVG(); stageEl().appendChild(p); p.style.transform = 'scale(1.25)'; LV.puff = p; }
async function puffStep(k, n) {
  const p = LV.puff; if (!p) return;
  const sc = 1.25 - (k / n) * 0.45; Snd.deflate(); p.style.transform = `scale(${sc})`;
  if (k >= Math.ceil(n / 2)) $('.pf-brow', p).setAttribute('d', 'M60 70 L92 70 M140 70 L108 70');
  if (k < n) { await wait(500); return; }
  $('.pf-brow', p).setAttribute('d', 'M60 72 Q76 60 92 70 M140 72 Q124 60 108 70'); $('.pf-mouth', p).setAttribute('d', 'M78 122 Q100 150 122 122');
  await wait(400);
  p.animate([{ transform: `scale(${sc}) rotate(0)` }, { transform: `scale(${sc * 1.1}) rotate(360deg)` }, { transform: `scale(${sc}) rotate(360deg)` }], { duration: 900 });
  Snd.sparkle(); await speak('l_bosswin'); addCoins(15, p); await wait(500);
}

/* --- level flow --- */
function pearls(i, n) { $('#p-pearls').innerHTML = Array.from({ length: n }, (_, j) => `<i class="${j < i ? 'on' : j === i ? 'now' : ''}"></i>`).join(''); }
async function startLevel(n) {
  Snd.unlock(); cancelRun(); closeOverlay();
  const L = LEVELS[n];
  LV = { L, n, fast: 0, which: 0, busy: false, help: null, coins0: S.coins, lootN: 0, sent: false, place: null, rid: 0 };
  setTheme(C.worlds[L.wi].theme); show('play'); mountStage(!!L.sentences);
  const replay = !!S.done[L.id];
  const rounds = L.sentences ? (replay ? shuffle(L.sentences) : L.sentences).map(id => ({ t: 's', id }))
    : (replay ? shuffle(L.words) : L.words).map((w, i) => ({ t: !L.boss && !L.vowelSwitch && i === 2 ? 'b' : 'r', w, alts: L.alts && L.alts[w] }));
  pearls(0, rounds.length);
  try {
    if (L.boss) { mountPuff(); await speak('l_boss'); } else await speak('l_go');
    for (let i = 0; i < rounds.length; i++) {
      pearls(i, rounds.length); $('#tray').innerHTML = '';
      const rd = rounds[i];
      if (rd.t === 'r') await roundRead(rd.w, rd.alts); else if (rd.t === 'b') await roundBuild(rd.w); else await roundSentence(rd.id);
      $$('#stage .blocks, #stage .plats, #stage .say').forEach(e => e.remove()); $('#tray').innerHTML = '';
      if (L.boss) await puffStep(i + 1, rounds.length);
    }
    pearls(rounds.length, rounds.length);
    await levelDone();
  } catch (e) { if (e !== CANCEL) console.error(e); }
}
const CHEST = `<svg class="chest" viewBox="0 0 200 170" aria-hidden="true"><circle cx="100" cy="82" r="72" fill="#fff3b0" opacity=".75"/>
<g><rect x="28" y="74" width="144" height="80" rx="12" fill="#a8622e"/><rect x="28" y="74" width="144" height="14" fill="#8a4c20"/><rect x="88" y="74" width="24" height="80" fill="#ffc93c"/><rect x="92" y="98" width="16" height="20" rx="4" fill="#e6950b"/></g>
<g class="gold"><circle cx="70" cy="72" r="12" fill="#ffc93c" stroke="#e6950b" stroke-width="3"/><circle cx="98" cy="66" r="12" fill="#ffc93c" stroke="#e6950b" stroke-width="3"/><circle cx="128" cy="72" r="12" fill="#ffc93c" stroke="#e6950b" stroke-width="3"/></g>
<g class="lid"><path d="M28 76 V56 Q28 22 100 22 Q172 22 172 56 V76 Z" fill="#c07436"/><rect x="88" y="22" width="24" height="54" fill="#ffc93c"/></g></svg>`;
async function levelDone() {
  const { L, n } = LV;
  const first = !S.done[L.id]; S.done[L.id] = true;
  const d = today(); d.levels++;
  const k = dayKey();
  if (S.lastDay !== k) { const y = dayKey(new Date(Date.now() - 864e5)); S.streak = S.lastDay === y ? (S.streak || 0) + 1 : 1; S.lastDay = k; }
  const friend = first ? (C.friends.find(f => !S.friends.includes(f[0])) || null) : null;
  if (friend) S.friends.push(friend[0]);
  const goal = !d.goalDone && d.levels >= S.goal; if (goal) d.goalDone = true;
  const bonus = 10 + (goal ? 25 : 0), earned = S.coins - LV.coins0, hasNext = n + 1 < LEVELS.length;
  save(true); Snd.fanfare();
  overlay(`<h2>${L.boss ? 'Puff is happy!' : 'You did it!'}</h2>${CHEST}<div class="tally"><i class="coin"></i><span id="tl">+0</span></div><div id="nf"></div>
    <div class="row"><button class="ibtn" id="ov-map" aria-label="Map" style="width:84px;height:84px"><svg><use href="#i-home"/></svg></button>${hasNext ? '<button class="big-btn" id="ov-next"><svg><use href="#i-play"/></svg>Next</button>' : ''}</div>`);
  $('#ov-map').onclick = () => { Snd.click(); mapW = LEVELS[Math.min(n + 1, LEVELS.length - 1)].wi; renderMap(); };
  if (hasNext) $('#ov-next').onclick = () => { Snd.click(); startLevel(n + 1); };
  try {
    await speak('l_done');
    const ch = $('#ov .chest'); ch.classList.add('open'); Snd.sparkle(); addCoins(bonus, ch);
    const tl = $('#tl'), total = earned + bonus;
    for (let i = 1; i <= 12; i++) { tl.textContent = '+' + Math.round(total * i / 12); await wait(45); }
    if (friend) { $('#nf').innerHTML = `<span class="newfriend emo">${friend[1]}</span>`; await wait(500); await speak('l_friend'); await speak('f_' + friend[0]); }
    if (goal) { $('#nf').insertAdjacentHTML('beforeend', '<p style="font-weight:700;margin:6px 0 0">Today\'s reading goal: done!</p>'); await wait(300); await speak(isQ() ? 'l_goal' : 'l_done'); }
  } catch (e) { if (e !== CANCEL) throw e; }
}

/* ===== wiring & boot ===== */
$('#p-home').addEventListener('click', () => {
  Snd.click();
  overlay(`<h2>Take a break?</h2><div class="row"><button class="ibtn" id="ov-map" aria-label="Map" style="width:84px;height:84px"><svg><use href="#i-home"/></svg></button><button class="big-btn" id="ov-go"><svg><use href="#i-play"/></svg>Keep going</button></div>`);
  $('#ov-go').onclick = () => { Snd.click(); closeOverlay(); };
  $('#ov-map').onclick = () => { Snd.click(); save(true); renderMap(); };
});
$('#p-snail').addEventListener('click', () => { if (LV && LV.help && !LV.busy) LV.help().catch(() => {}); else Snd.boing(); });
window.addEventListener('resize', () => { if (screen === 'play' && LV && LV.place) { try { LV.place(); } catch (e) {} } else if (screen === 'map') renderMap(); });
['pointerdown', 'touchend', 'click'].forEach(ev => document.addEventListener(ev, () => Snd.unlock(), { passive: true, capture: true }));
applySettings(); renderTitle(); initDb();
</script>
