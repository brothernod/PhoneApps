<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Nala's Bonk Golf</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#eee;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
canvas{display:block;touch-action:none}
#hud{position:fixed;display:flex;align-items:center;justify-content:flex-end;gap:6px;padding-right:8px;box-sizing:border-box;z-index:5;pointer-events:none}
#hud button{pointer-events:auto;background:rgba(255,255,255,.09);border:none;color:#fff;font-size:17px;width:38px;height:34px;border-radius:9px;cursor:pointer}
#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.62);z-index:10;padding:16px;box-sizing:border-box}
#ov.hidden{display:none}
.card{background:#17120f;border:1px solid #3d2c22;border-radius:18px;padding:20px 18px;max-width:350px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.6);max-height:90vh;overflow:auto}
.card h2{margin:2px 0 10px;font-size:23px}
.card .kicker{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#e0624f;font-weight:700}
.bubble{background:#2a1f19;border-radius:14px;padding:12px 14px;line-height:1.45;font-size:15.5px;margin:8px 0 12px;position:relative}
.bubble b{color:#ffb38a}
.small{font-size:13px;color:#b9a99c;line-height:1.45}
.how{background:#100c0a;border-radius:12px;padding:10px 12px;margin:10px 0;font-size:13px;line-height:1.5;color:#cdbdb0}
.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
.row button{padding:11px 16px;border-radius:11px;border:none;background:#332822;color:#fff;font-size:15px;cursor:pointer;font-weight:600}
.row button.primary{background:#e0453a}
.row button:disabled{opacity:.35}
.stats{list-style:none;padding:0;margin:10px 0;font-size:15px;line-height:1.75}
.stats b{color:#ffb38a}
.title{font-size:18px;font-weight:700;color:#ffd27a;margin:4px 0 6px}
.set label{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid #2a201a;font-size:15px}
.set label span{display:block}
.set label small{display:block;color:#9d8d80;font-size:12px;margin-top:2px}
.set input[type=checkbox]{width:22px;height:22px;accent-color:#e0453a;flex:none}
.set select{font-size:15px;background:#2a1f19;color:#fff;border:1px solid #4a3a30;border-radius:8px;padding:4px 6px}
.newbest{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:8px;background:#ffd27a;color:#2a1a0a;font-size:11px;font-weight:800;letter-spacing:.06em}
.set button{font-size:14px;background:#332822;color:#fff;border:none;border-radius:8px;padding:6px 12px}
.rev{margin-top:12px;text-align:center;font-size:11px;color:#6f6157;letter-spacing:.04em}
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<div id="hud">
  <button id="bDir" title="Directions">📜</button>
  <button id="bRst" title="Restart this attempt">↻</button>
  <button id="bSet" title="Workshop settings">⚙️</button>
</div>
<div id="ov" class="hidden"><div class="card" id="card"></div></div>
<script src="version.js?v=202611161742"></script>
<script src="levels.js?v=202611161742"></script>
<script src="audio.js?v=202611161742"></script>
<script src="game.js?v=202611161742"></script>
<script src="render.js?v=202611161742"></script>
</body>
</html>
