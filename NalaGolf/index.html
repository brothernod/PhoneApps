<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Nala's Bonk Golf</title>
<meta name="description" content="A dark house, a blind shar-pei, and a lot of bonks. For Ashley & Corbin.">
<meta name="theme-color" content="#0b0620">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nala Golf">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0b0620;--bar:#120a2e;--line:#3a1f6e;--cyan:#29f6ff;--mag:#ff3df2;--yel:#ffe066;--pur:#b44dff;--nala:#ffb36b;--txt:#efe9ff;--dim:#b3a6d9}
html,body{margin:0;height:100%;background:var(--ink);overflow:hidden;touch-action:none;font-family:"Space Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--txt);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
/* safe areas: #wrap's padding is read by resize() so the 400×700 world sits clear of the notch and home bar */
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--ink);box-sizing:border-box;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
canvas{display:block;touch-action:none}
#hud{position:fixed;display:flex;align-items:center;justify-content:flex-end;gap:6px;padding-right:8px;box-sizing:border-box;z-index:5;pointer-events:none}
#hud button{pointer-events:auto;width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:#1a0f3d;color:var(--cyan);display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;transition:background .2s,color .2s,border-color .2s}
#hud button:active{background:#2a1859}
#hud.off{display:none}
#hud button svg{width:21px;height:21px}
#hud.lit button{background:#efe3cb;border-color:#4a3426;color:#4a3426}
#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(5,2,18,.66);z-index:10;box-sizing:border-box;
  padding:calc(16px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) calc(16px + env(safe-area-inset-left,0px))}
/* title + end cards sit low so the neon scene above stays visible */
#ov.front{background:transparent;align-items:flex-end;pointer-events:none;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px))}
#ov.front .card{pointer-events:auto;background:rgba(20,10,51,.9)}
#ov.paper{background:rgba(40,26,14,.28)}
#ov.hidden{display:none}
.card{background:#140a33;border:1.5px solid var(--line);border-radius:18px;padding:20px 18px;max-width:350px;width:100%;box-shadow:0 0 0 1px rgba(180,77,255,.18),0 0 28px rgba(180,77,255,.35),0 12px 40px rgba(0,0,0,.6);max-height:90vh;overflow:auto;box-sizing:border-box}
.card h2{margin:2px 0 10px;font:400 22px/1.2 Audiowide,"Space Grotesk",sans-serif;color:var(--cyan);text-shadow:0 0 10px rgba(41,246,255,.55)}
.card .kicker{font:400 12px Audiowide,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--mag);text-shadow:0 0 8px rgba(255,61,242,.5)}
.bubble{background:#1a0f3d;border:1px solid var(--line);border-radius:14px;padding:12px 14px;line-height:1.45;font-size:15.5px;margin:8px 0 12px}
.bubble b{color:var(--nala)}
.small{font-size:13px;color:var(--dim);line-height:1.5}
.small b{color:var(--nala)}
.how{background:#0f0828;border:1px solid #24134d;border-radius:12px;padding:10px 12px;margin:10px 0;font-size:13px;line-height:1.55;color:#c9bfe8}
.how b{color:var(--cyan);font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
.row button{padding:11px 16px;border-radius:12px;border:1px solid var(--line);background:#1a0f3d;color:var(--cyan);font:600 15px "Space Grotesk",system-ui,sans-serif;cursor:pointer}
.row button.primary{background:var(--mag);border-color:var(--mag);color:#22052a;box-shadow:0 0 14px rgba(255,61,242,.6)}
.row button:disabled{opacity:.35}
.stats{list-style:none;padding:0;margin:10px 0;font-size:15px;line-height:1.75}
.stats b{color:var(--nala)}
.title{font:400 15px Audiowide,sans-serif;color:var(--yel);margin:4px 0 6px}
.set label{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid #24134d;font-size:15px}
.set label span{display:block}
.set label small{display:block;color:#8f84b5;font-size:12px;margin-top:2px}
.set input[type=checkbox]{width:22px;height:22px;accent-color:var(--mag);flex:none}
.set select{font:15px "Space Grotesk",sans-serif;background:#1a0f3d;color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:4px 6px}
.set button{font:14px "Space Grotesk",sans-serif;background:#1a0f3d;color:var(--cyan);border:1px solid var(--line);border-radius:8px;padding:6px 12px}
.newbest{display:inline-block;padding:2px 8px;border-radius:8px;background:var(--yel);color:#2a1a0a;font:400 11px Audiowide,sans-serif;letter-spacing:.06em}
.rev{margin-top:12px;text-align:center;font-size:11px;color:#6d5f98;letter-spacing:.04em}
/* lights-on (Storybook Sketch) cards: the results card sits over the lit replay */
.card.paper{background:#f7efdf;border-color:#4a3426;color:#2b2420;box-shadow:0 6px 22px rgba(0,0,0,.28)}
.card.paper h2{color:#4a3426;text-shadow:none;margin:0;font-size:19px}
.card.paper .kicker{color:#b0523f;text-shadow:none}
.card.paper .title{color:#d42fc8;margin:0;font-size:13px}
.card.paper .small{color:#4a4038}
.card.paper .small b{color:#4a3426}
.card.paper .row button{background:#efe3cb;border-color:#4a3426;color:#4a3426}
.card.paper .row button.primary{background:var(--mag);border-color:#4a3426;color:#2a0626;box-shadow:none}
.card.paper .rev{color:#9a8a78}
.rhead{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
.grid{display:flex;gap:4px;margin:6px 0 10px;padding:8px 0;border-top:1px dashed #c9ad86;border-bottom:1px dashed #c9ad86}
.grid div{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.grid b{font:400 20px Audiowide,sans-serif;color:#2b2420}
.grid span{font-size:11px;color:#4a4038;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.nbwrap{text-align:center;margin:-2px 0 8px}
.center{text-align:center}
.note{margin-top:10px;font-size:12px;color:#8f84b5}
.ded{text-align:center;font-size:17px;line-height:1.45;margin:2px 0 8px;color:var(--txt)}
.ded b{color:var(--nala);font-weight:700}
.ded span{font-size:14px;color:var(--dim)}
.lvls{display:flex;flex-direction:column;gap:7px;margin:10px 0 6px}
.lvl{display:flex;align-items:center;gap:12px;width:100%;padding:9px 12px;border-radius:12px;border:1px solid var(--line);background:#1a0f3d;color:var(--txt);text-align:left;cursor:pointer;font-family:inherit}
.lvl:active{background:#2a1859}
.lvl.done{border-color:rgba(41,246,255,.45)}
.lvl:disabled{opacity:.42;cursor:default}
.lvl .em{font-size:24px;width:30px;text-align:center;flex:none}
.lvl .tx{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.lvl .nm{font:400 15px Audiowide,"Space Grotesk",sans-serif;color:var(--cyan)}
.lvl .bs{font-size:12px;color:var(--dim)}
.lvl .ck{color:var(--yel);font-size:18px;flex:none}
.set input[type=range]{width:140px;accent-color:var(--mag)}
.endn{display:flex;flex-direction:column;align-items:center;margin:6px 0 4px}
.endn b{font:400 40px Audiowide,sans-serif;color:var(--yel);text-shadow:0 0 14px rgba(255,224,102,.55)}
.endn span{font-size:13px;color:var(--dim)}
.unlock{margin:10px 0 2px;padding:10px 12px;border:1.5px solid var(--yel);border-radius:12px;background:rgba(255,224,102,.08);text-align:center;font-size:15px;line-height:1.35;box-shadow:0 0 14px rgba(255,224,102,.25)}
.unlock b{color:var(--yel)}
.unlock small{display:block;font-size:12px;color:var(--dim);margin-top:4px}
.unlock .sub{font-size:12px;color:var(--txt);margin-top:8px;opacity:.85}
.rmx{color:#9ef7ff}
.tut{margin:10px 0;padding:10px 12px 8px;border:1.5px solid var(--cyan);border-radius:12px;background:rgba(41,246,255,.07);box-shadow:0 0 14px rgba(41,246,255,.2);font-size:14px;line-height:1.4}
.tut b{color:var(--cyan);font-family:Audiowide,sans-serif;font-weight:400}
.tut ul{margin:6px 0 0;padding-left:18px}.tut li{margin:3px 0;color:var(--txt)}.tut i{color:var(--yel);font-style:normal}
.cos{margin:2px 0 4px}
/* title card: kept short so Nala, Stella and Binx stay in view above it */
.card.titlecard{padding:14px 16px 10px}.titlecard .ded{margin:0 0 6px}.titlecard .row{margin-top:12px;flex-wrap:nowrap}.titlecard .rev{margin-top:8px}
.row button.icon{width:46px;padding:0;display:flex;align-items:center;justify-content:center;flex:none}.row button.icon svg{width:22px;height:22px}.row button.icon.off{color:var(--dim)}.cos b{color:var(--yel);font-weight:600}.cos span{opacity:.7}
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<div id="hud">
  <button id="bDir" title="Directions" aria-label="Directions"><svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M3 6l5-2 6 2 5-2v13l-5 2-6-2-5 2z"/><path d="M8 4v13M14 6v13"/></svg></button>
  <button id="bRst" title="Restart this attempt" aria-label="Restart attempt"><svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M5 11a6 6 0 1 0 2-4.5"/><path d="M5 3.5v4h4"/></svg></button>
  <button id="bSet" title="Workshop settings" aria-label="Settings"><svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="11" cy="11" r="3"/><path d="M11 2.5v2.6M11 16.9v2.6M2.5 11h2.6M16.9 11h2.6M5 5l1.8 1.8M15.2 15.2L17 17M5 17l1.8-1.8M15.2 6.8L17 5"/></svg></button>
</div>
<div id="ov" class="hidden"><div class="card" id="card"></div></div>
<script src="version.js?v=202611170809"></script>
<script src="levels.js?v=202611170809"></script>
<script src="audio.js?v=202611170809"></script>
<script src="game.js?v=202611170809"></script>
<script src="render.js?v=202611170809"></script>
</body>
</html>
