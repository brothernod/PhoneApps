  --display: "Bungee", "Arial Black", Impact, system-ui, sans-serif;
  --led: "Press Start 2P", ui-monospace, Menlo, monospace;
  --ui: -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", Roboto, sans-serif;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; background: var(--night); color: var(--concrete); }
body {
  position: fixed; inset: 0;
  font-family: var(--ui);
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%;
  overscroll-behavior: none;
}
[hidden] { display: none !important; }
canvas#world { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
button {
  font: inherit; color: inherit; border: 0; background: none; cursor: pointer;
  touch-action: manipulation; -webkit-tap-highlight-color: transparent;
}
button:focus-visible { outline: 3px solid var(--hazard); outline-offset: 3px; }

/* ---------- HUD ---------- */
#hud {
  position: fixed; left: 0; right: 0; top: 0; z-index: 5;
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: start; gap: 8px;
  padding: calc(var(--safe-t) + 10px) calc(var(--safe-r) + 12px) 0 calc(var(--safe-l) + 12px);
  pointer-events: none;
}
.hud-left { justify-self: start; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
.hud-right { justify-self: end; }
.led { font-family: var(--led); color: var(--amber); text-shadow: 0 0 10px rgba(255, 180, 59, .55); }
.scorebox {
  display: flex; flex-direction: column; gap: 6px; padding: 9px 10px 8px;
  border-radius: 10px; background: rgba(6, 8, 26, .8); box-shadow: inset 0 0 0 2px #262E5E;
}
.led-score { font-size: clamp(12px, 3.6vw, 18px); line-height: 1; }
.cap { font: 600 11px/1 var(--ui); color: var(--dim); }
.hearts { display: flex; gap: 4px; }
.heart { display: block; width: 26px; height: 26px; transition: transform .25s, opacity .25s; }
.heart svg { width: 100%; height: 100%; fill: var(--heart); stroke: rgba(6, 8, 26, .7); stroke-width: 1.5; }
.heart.lost { opacity: .35; transform: scale(.8); }
.heart.lost svg { fill: transparent; stroke: #fff; }
.elevator {
  display: flex; flex-direction: column; align-items: stretch; gap: 7px;
  padding: 10px 14px 9px 12px; border-radius: 12px;
  background: #06081A; box-shadow: inset 0 0 0 2px #2A3266, 0 5px 0 rgba(3, 5, 20, .45);
}
.elevator-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.elevator-arrow { width: 16px; height: 14px; fill: rgba(255, 180, 59, .22); transition: fill .15s; }
.elevator-arrow.on { fill: var(--amber); filter: drop-shadow(0 0 6px rgba(255, 180, 59, .85)); }
.led-floor { font-size: clamp(22px, min(8.4vw, 6.4vh), 44px); line-height: 1; min-width: 3ch; text-align: right; }
.elevator-row2 { display: flex; align-items: center; gap: 8px; }
.meter { flex: 1; height: 5px; border-radius: 3px; background: #1D2450; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--amber); transform-origin: left center; transform: scaleX(0); transition: transform .3s ease; }
.elevator-of { font: 600 11px/1 var(--ui); color: var(--dim); white-space: nowrap; }
.round-btn {
  width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center;
  background: rgba(6, 8, 26, .8); box-shadow: inset 0 0 0 2px #2A3266; pointer-events: auto;
}
.round-btn svg { width: 20px; height: 20px; fill: var(--concrete); }
.bump { animation: bump .28s ease-out; }
@keyframes bump { 40% { transform: scale(1.14); } }

.hint {
  position: fixed; left: 50%; top: calc(var(--safe-t) + 21%); z-index: 6; transform: translateX(-50%);
  padding: 10px 16px; border-radius: 999px; background: rgba(6, 8, 26, .72);
  font-family: var(--display); font-size: 16px; letter-spacing: .02em; color: #fff; white-space: nowrap;
  pointer-events: none; transition: opacity .4s;
}
.hint.fade { opacity: 0; }

/* ---------- Screens ---------- */
.screen {
  position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center;
  padding: calc(var(--safe-t) + 14px) calc(var(--safe-r) + 14px) calc(var(--safe-b) + 14px) calc(var(--safe-l) + 14px);
}
.panel {
  position: relative; width: min(460px, 100%); max-height: 100%; overflow-y: auto; -webkit-overflow-scrolling: touch;
  touch-action: pan-y; background: rgba(13, 18, 46, .93); border-radius: 18px; padding: 28px 20px 20px;
  box-shadow: 0 22px 50px rgba(3, 5, 20, .5), inset 0 0 0 2px rgba(255, 255, 255, .05);
}
.panel::before {
  content: ""; position: absolute; left: 0; right: 0; top: 0; height: 9px; border-radius: 18px 18px 0 0;
  background: repeating-linear-gradient(-45deg, var(--hazard) 0 11px, #17161A 11px 22px);
}
.screen:not([hidden]) .panel { animation: rise .32s cubic-bezier(.2, .8, .3, 1); }
@keyframes rise { from { transform: translateY(24px); opacity: 0; } }
h2 { font-family: var(--display); font-weight: 400; text-transform: uppercase; font-size: 26px; line-height: 1.1; text-align: center; color: var(--hazard); }
.btn {
  display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; min-height: 56px;
  padding: 12px 18px; border-radius: 14px; font-family: var(--display); font-size: 20px; text-transform: uppercase;
  color: #2B1E00; background: var(--hazard); box-shadow: 0 6px 0 var(--hazard-edge);
  transition: transform .07s ease, box-shadow .07s ease;
}
.btn:active { transform: translateY(5px); box-shadow: 0 1px 0 var(--hazard-edge); }
.btn-quiet { color: var(--concrete); background: #2A3366; box-shadow: 0 6px 0 var(--steel-edge); }
.btn-quiet:active { box-shadow: 0 1px 0 var(--steel-edge); }
.btn-text { width: 100%; min-height: 44px; font: 600 15px/1.2 var(--ui); color: var(--dim); text-decoration: underline; text-underline-offset: 3px; }
.stack-gap > * + * { margin-top: 14px; }

/* ---------- Menu ---------- */
.menu { width: min(440px, 100%); max-height: 100%; overflow-y: auto; touch-action: pan-y; padding: 4px 2px 10px; }
.title { margin: 0 auto 18px; width: min(320px, 82%); font-family: var(--display); font-weight: 400; line-height: 1; text-transform: uppercase; }
.title-floor {
  position: relative; display: block; padding: 13px 0 11px; text-align: center; color: #fff;
  font-size: clamp(42px, 13vw, 66px); text-shadow: 0 3px 0 rgba(0, 0, 0, .18);
  box-shadow: inset 0 7px 0 rgba(255, 255, 255, .26), inset 0 -5px 0 rgba(0, 0, 0, .16);
}
.title-sky { width: 86%; margin-left: 14%; background: hsl(262 56% 62%); }
.title-stack { background: hsl(205 62% 50%); }
.title-chip {
  position: absolute; top: 0; left: 100%; width: 16.3%; height: 100%; background: hsl(262 56% 62%);
  box-shadow: inset 0 7px 0 rgba(255, 255, 255, .26), inset 0 -5px 0 rgba(0, 0, 0, .16);
  transform-origin: 0 0;
}
.title-chip.drop { animation: chip 1s .55s cubic-bezier(.5, 0, .9, .6) forwards; }
@keyframes chip { to { transform: translate(18px, 150px) rotate(32deg); opacity: 0; } }
.tagline { max-width: 32ch; margin: 0 auto 22px; text-align: center; font-size: 16px; font-weight: 600; line-height: 1.4; color: #16204F; text-shadow: 0 0 8px rgba(236, 246, 255, .95), 0 0 2px rgba(236, 246, 255, .95); }
.modes { display: grid; gap: 16px; margin-bottom: 20px; }
.mode {
  position: relative; display: grid; grid-template-columns: 1fr auto; align-items: center; column-gap: 12px;
  width: 100%; padding: 16px 16px 15px 18px; text-align: left; border-radius: 16px;
  color: #052417; background: var(--go); box-shadow: 0 7px 0 var(--go-edge);
  transition: transform .07s ease, box-shadow .07s ease;
}
.mode:active { transform: translateY(6px); box-shadow: 0 1px 0 var(--go-edge); }
.mode-normal { color: #2C0D00; background: var(--safety); box-shadow: 0 7px 0 var(--safety-edge); }
.mode-normal:active { box-shadow: 0 1px 0 var(--safety-edge); }
.mode-name { grid-column: 1; font-family: var(--display); font-size: 30px; line-height: 1; text-transform: uppercase; }
.mode-desc { grid-column: 1; margin-top: 6px; font-size: 14px; font-weight: 600; line-height: 1.3; opacity: .86; }
.mode-best { grid-column: 1; margin-top: 10px; font-family: var(--led); font-size: 10px; line-height: 1.4; }
.mode-play { grid-column: 2; grid-row: 1 / span 3; width: 46px; height: 46px; border-radius: 50%; background: rgba(0, 0, 0, .14); display: grid; place-items: center; }
.mode-play svg { width: 20px; height: 20px; fill: currentColor; margin-left: 3px; }
.btn-sound { position: fixed; z-index: 11; top: calc(var(--safe-t) + 12px); right: calc(var(--safe-r) + 12px); }
.btn-sound .off { display: none; }
.btn-sound[aria-pressed="false"] .on { display: none; }
.btn-sound[aria-pressed="false"] .off { display: block; }

/* ---------- Results ---------- */
#results { align-items: flex-end; }
.results-panel { padding-top: 26px; }
.res-score { margin: 12px 0 14px; text-align: center; font-family: var(--led); font-size: clamp(30px, 10vw, 42px); line-height: 1; color: var(--amber); text-shadow: 0 0 14px rgba(255, 180, 59, .5); }
.tally { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px; }
.tally > div { padding: 9px 6px 8px; border-radius: 10px; background: rgba(255, 255, 255, .05); text-align: center; }
.tally dt { font-size: 12px; font-weight: 600; color: var(--dim); }
.tally dd { margin-top: 5px; font-family: var(--display); font-size: 18px; line-height: 1; color: var(--concrete); }
.tally .pts { display: block; margin-top: 5px; font-family: var(--led); font-size: 9px; color: var(--amber); }
.res-note { margin: -4px 0 14px; text-align: center; font-size: 14px; color: var(--dim); }
.entry { text-align: center; }
.entry-title { font-family: var(--display); font-size: 21px; line-height: 1.15; text-transform: uppercase; color: var(--go); }
.entry-sub { margin-top: 4px; font-size: 14px; color: var(--dim); }
.initials { display: flex; justify-content: center; gap: 12px; margin: 14px 0 18px; }
.slot { display: flex; flex-direction: column; align-items: center; gap: 7px; }
.slot .arrow {
  width: 66px; height: 44px; border-radius: 12px; display: grid; place-items: center;
  background: #2A3366; box-shadow: 0 4px 0 var(--steel-edge); transition: transform .06s, box-shadow .06s;
}
.slot .arrow:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--steel-edge); }
.slot .arrow svg { width: 18px; height: 14px; fill: var(--concrete); }
.slot .letter {
  width: 66px; height: 74px; border-radius: 12px; background: #06081A; box-shadow: inset 0 0 0 3px #2A3266;
  font-family: var(--led); font-size: 32px; line-height: 1; color: var(--amber); text-shadow: 0 0 10px rgba(255, 180, 59, .5);
}
.slot.active .letter { box-shadow: inset 0 0 0 3px var(--amber), 0 0 18px rgba(255, 180, 59, .35); }
.slot.active .letter span { animation: blink 1s steps(2, start) infinite; }
@keyframes blink { 50% { opacity: .25; } }
.res-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 4px; }
.res-actions .btn { padding: 12px 8px; font-size: 17px; white-space: nowrap; }
.res-actions .btn-text { grid-column: 1 / -1; }

/* ---------- Leaderboard ---------- */
.board { list-style: none; font-family: var(--led); font-size: 13px; line-height: 1; }
.board li { display: grid; grid-template-columns: 34px 52px 1fr 64px; gap: 8px; align-items: center; padding: 9px 8px; border-radius: 8px; }
.board li:nth-child(odd) { background: rgba(255, 255, 255, .045); }
.board .rk { color: var(--dim); }
.board .nm { color: var(--concrete); }
.board .sc { text-align: right; color: var(--amber); }
.board .fl { text-align: right; color: var(--dim); }
.board .fl b { font: 700 12px/1 var(--ui); color: var(--hazard); margin-left: 2px; }
.board li.r1 .rk, .board li.r1 .nm { color: #FFD23F; }
.board li.r2 .rk, .board li.r2 .nm { color: #D9E2F2; }
.board li.r3 .rk, .board li.r3 .nm { color: #F0A35E; }
.board li.empty { opacity: .32; }
.board li.new { background: rgba(255, 210, 63, .2); box-shadow: inset 0 0 0 2px rgba(255, 210, 63, .7); }
.board li.new .nm, .board li.new .sc { animation: blink .7s steps(2, start) 8; }
.board-head { display: grid; grid-template-columns: 34px 52px 1fr 64px; gap: 8px; padding: 0 8px 8px; font-size: 12px; font-weight: 600; color: var(--dim); }
.board-head span:nth-child(3), .board-head span:nth-child(4) { text-align: right; }
.mini { margin-bottom: 16px; font-size: 11px; }
.mini li { padding: 7px 8px; }
.tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 16px 0 14px; }
.tab {
  min-height: 46px; border-radius: 12px; font-family: var(--display); font-size: 17px; text-transform: uppercase;
  color: var(--dim); background: #1F2756;
}
.tab[aria-selected="true"][data-tab="easy"] { color: #052417; background: var(--go); }
.tab[aria-selected="true"][data-tab="normal"] { color: #2C0D00; background: var(--safety); }
.scores-foot { display: grid; gap: 6px; margin-top: 16px; }
.note { margin-top: 10px; text-align: center; font-size: 13px; line-height: 1.4; color: var(--dim); }
.pause-panel { width: min(360px, 100%); }
.pause-panel .btn { margin-top: 16px; }

/* Landscape: results sit to the right so the finished tower has room on the left. */
@media (min-aspect-ratio: 5/4) {
  #results { align-items: center; justify-content: flex-end; }
  .results-panel { width: min(420px, 52%); }
}
/* Short screens (phones in landscape, small phones) */
@media (max-height: 700px) {
  .panel { padding: 22px 16px 16px; }
  .res-score { margin: 8px 0 10px; font-size: 28px; }
  .tally { margin-bottom: 12px; }
  .initials { margin: 10px 0 12px; }
  .slot .arrow { height: 38px; }
  .slot .letter { height: 58px; font-size: 26px; }
  .mini li { padding: 5px 8px; }
  .title { margin-bottom: 12px; }
  .title-floor { font-size: clamp(34px, 11vw, 52px); padding: 10px 0 8px; }
  .tagline { margin-bottom: 14px; font-size: 15px; }
  .modes { gap: 12px; margin-bottom: 14px; }
  .mode { padding: 12px 14px 12px 16px; }
  .mode-name { font-size: 25px; }
}
@media (max-height: 460px) {
  .hint { top: calc(var(--safe-t) + 30%); }
  .heart { width: 22px; height: 22px; }
  .elevator { padding: 7px 12px 7px 10px; gap: 5px; }
  .scorebox { padding: 7px 9px 6px; }
  h2 { font-size: 21px; }
  .res-score { margin: 6px 0 10px; font-size: 24px; }
  .tally, .entry-sub { display: none; }
  .initials { margin: 8px 0 10px; gap: 10px; }
  .slot { gap: 5px; }
  .slot .arrow { width: 58px; height: 32px; }
  .slot .letter { width: 58px; height: 46px; font-size: 22px; }
  .btn { min-height: 46px; font-size: 18px; }
  .btn-text { min-height: 36px; }
}
/* Phones in landscape: title on the left, buttons on the right. */
@media (max-height: 520px) and (min-aspect-ratio: 4/3) {
  .menu { width: min(860px, 100%); display: grid; grid-template-columns: 1fr 1.1fr; gap: 24px; align-items: center; }
  .title { width: min(300px, 90%); }
  .tagline { margin-bottom: 0; }
  .modes { gap: 12px; margin-bottom: 14px; }
  .mode-desc { font-size: 13px; }
  .btn-sound { top: auto; right: auto; bottom: calc(var(--safe-b) + 12px); left: calc(var(--safe-l) + 12px); }
}
@media (prefers-reduced-motion: reduce) {
  .screen:not([hidden]) .panel, .bump { animation: none; }
  .title-chip { display: none; }
  .slot.active .letter span, .board li.new .nm, .board li.new .sc { animation: none; }
}
</style>
</head>
<body>
<canvas id="world" aria-label="Sky Stack. Tap anywhere to drop the moving floor."></canvas>

<div id="hud" hidden>
  <div class="hud-left">
    <div class="scorebox"><span class="led led-score" id="hudScore">0</span><span class="cap">score</span></div>
    <div class="hearts" id="hudHearts" hidden></div>
  </div>
  <div class="elevator" aria-live="polite">
    <div class="elevator-row">
      <svg class="elevator-arrow" id="hudArrow" viewBox="0 0 16 14" aria-hidden="true"><path d="M8 0l8 14H0z"/></svg>
      <span class="led led-floor" id="hudFloor">0</span>
    </div>
    <div class="elevator-row2"><span class="meter"><i id="hudMeter"></i></span><span class="elevator-of" id="hudTarget">of 50</span></div>
  </div>
  <div class="hud-right">
    <button class="round-btn" id="btnPause" aria-label="Pause"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="4" y="3" width="4.5" height="14" rx="1.2"/><rect x="11.5" y="3" width="4.5" height="14" rx="1.2"/></svg></button>
  </div>
</div>
<div class="hint" id="hint" hidden></div>

<section class="screen" id="menu">
  <div class="menu">
    <div class="menu-head">
      <h1 class="title" aria-label="Sky Stack">
        <span class="title-floor title-sky" aria-hidden="true">Sky<i class="title-chip" id="titleChip"></i></span>
        <span class="title-floor title-stack" aria-hidden="true">Stack</span>
      </h1>
      <p class="tagline">Drop each floor on top of the last one. Whatever hangs over the edge falls off.</p>
    </div>
    <div class="menu-actions">
    <div class="modes">
      <button class="mode mode-easy" data-mode="easy">
        <span class="mode-name">Easy</span>
        <span class="mode-desc">50 floors and 3 hearts. Floors slow down and glow when they line up.</span>
        <span class="mode-best" id="bestEasy"></span>
        <span class="mode-play" aria-hidden="true"><svg viewBox="0 0 20 20"><path d="M4 2.5v15L17 10z"/></svg></span>
      </button>
      <button class="mode mode-normal" data-mode="normal">
        <span class="mode-name">Normal</span>
        <span class="mode-desc">100 floors. One miss ends it, and it speeds up as you climb.</span>
        <span class="mode-best" id="bestNormal"></span>
        <span class="mode-play" aria-hidden="true"><svg viewBox="0 0 20 20"><path d="M4 2.5v15L17 10z"/></svg></span>
      </button>
    </div>
    <button class="btn btn-quiet" id="btnScores">High scores</button>
    </div>
  </div>
  <button class="round-btn btn-sound" id="btnSound" aria-label="Sound" aria-pressed="true">
    <svg class="on" viewBox="0 0 20 20" aria-hidden="true"><path d="M2 7.5h3.5L10 3.5v13l-4.5-4H2z"/><path d="M13 6.2a5 5 0 0 1 0 7.6l-1.2-1.3a3.3 3.3 0 0 0 0-5z"/><path d="M15.3 3.8a8.4 8.4 0 0 1 0 12.4l-1.2-1.2a6.7 6.7 0 0 0 0-10z"/></svg>
    <svg class="off" viewBox="0 0 20 20" aria-hidden="true"><path d="M2 7.5h3.5L10 3.5v13l-4.5-4H2z"/><path d="M12.6 7.2l1.2-1.2 2 2 2-2 1.2 1.2-2 2 2 2-1.2 1.2-2-2-2 2-1.2-1.2 2-2z"/></svg>
  </button>
</section>

<section class="screen" id="pause" hidden>
  <div class="panel pause-panel">
    <h2>Paused</h2>
    <button class="btn" id="btnResume">Resume</button>
    <button class="btn btn-quiet" id="btnQuit">Quit to menu</button>
  </div>
</section>

<section class="screen" id="results" hidden>
  <div class="panel results-panel" id="resultsPanel">
    <h2 id="resTitle">Game over</h2>
    <div class="res-score" id="resScore">0</div>
    <dl class="tally">
      <div><dt>Floors</dt><dd id="resFloors">0</dd><span class="pts" id="resFloorsPts">+0</span></div>
      <div><dt>Perfect</dt><dd id="resPerfect">0</dd><span class="pts" id="resPerfectPts">+0</span></div>
      <div><dt>Top-out</dt><dd id="resTop">–</dd><span class="pts" id="resTopPts">&nbsp;</span></div>
    </dl>
    <p class="res-note" id="resNote" hidden></p>
    <div class="entry" id="entry" hidden>
      <p class="entry-title">New high score! <span id="entryRank">#1</span></p>
      <p class="entry-sub">Pick your initials</p>
      <div class="initials" id="initials"></div>
      <button class="btn" id="btnSave">Save score</button>
      <button class="btn-text" id="btnSkip">Don’t save</button>
    </div>
    <ol class="board mini" id="miniBoard" hidden></ol>
    <div class="res-actions" id="resActions" hidden>
      <button class="btn" id="btnAgain">Play again</button>
      <button class="btn btn-quiet" id="btnMenu">Menu</button>
      <button class="btn-text" id="btnResScores">High scores</button>
    </div>
  </div>
</section>

<section class="screen" id="scores" hidden>
  <div class="panel">
    <h2>High scores</h2>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="easy" aria-selected="true">Easy</button>
      <button class="tab" role="tab" data-tab="normal" aria-selected="false">Normal</button>
    </div>
    <div class="board-head" aria-hidden="true"><span>#</span><span>Name</span><span>Score</span><span>Floor</span></div>
    <ol class="board" id="board"></ol>
    <div class="scores-foot">
      <button class="btn" id="btnScoresBack">Back</button>
      <button class="btn-text" id="btnReset">Clear Easy scores</button>
    </div>
    <p class="note" id="storageNote">Scores are saved on this device.</p>

<noscript><p style="position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center">Sky Stack needs JavaScript turned on.</p></noscript>

<script>
(() => {
'use strict';

/* =====================================================================
   Tunables. World units: the lobby and first floor are 100 wide and
   each floor is 18 tall, so difficulty is the same on every screen.
   ===================================================================== */
const BASE_W = 100;          // width of the lobby and the first floor
const FH = 18;               // floor height
const LOBBY_H = 26;          // ground-floor lobby height
const SWING = 75;            // how far the moving floor travels either side of the tower
const TAP_COOLDOWN = 0.22;   // a new floor ignores taps this long (stops accidental double taps)
const ENTER_TIME = 0.2;      // fly-in animation for each new floor
const BOARD_SIZE = 10;       // leaderboard rows per mode
const MENU_SKY = 0.06;

const MODES = {
  easy: {
    id: 'easy', name: 'Easy', floors: 50, lives: 3,
    speedStart: 48, speedEnd: 70,                 // world units per second
    perfect: 9,                                   // offset that still counts as a perfect drop
    growAfter: 2, grow: 8,                        // perfect streak that regrows the floor, and by how much
    magnet: { radius: 32, slowStart: 0.30, slowEnd: 0.42 }, // slows down over the tower
    glow: true,                                   // target outline + glow when lined up
    hint: 'Tap when the floor glows',
  },
  normal: {
    id: 'normal', name: 'Normal', floors: 100, lives: 1,
    speedStart: 75, speedEnd: 200,
    perfect: 3,
    growAfter: 3, grow: 3,
    magnet: null,
    glow: false,
    hint: 'Tap when it lines up',
  },
};
const POINTS = { floor: 10, perfect: 10, maxMultiplier: 5, topOut: 500, perWidthPct: 5, perHeart: 100 };

/* ---------- helpers ---------- */
const $ = (id) => document.getElementById(id);
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const smoothstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const easeOutCubic = (t) => 1 - Math.pow(1 - t, 3);
const easeInOutCubic = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const fmt = (n) => Math.round(n).toLocaleString('en-US');
const rand = (a, b) => a + Math.random() * (b - a);
function mulberry32(seed) {
  let a = seed | 0;
  return () => {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hash2(a, b) {
  let h = Math.imul(a | 0, 374761393) ^ Math.imul((b | 0) + 7919, 668265263);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
const hexRgb = (h) => { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
const mix = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
const rgba = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
const hsla = (h, s, l, a = 1) => `hsla(${h.toFixed(1)},${s}%,${l.toFixed(1)}%,${a})`;
const reduceMotion = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);

/* ---------- storage (localStorage, with an in-memory fallback) ---------- */
const store = (() => {
  const PREFIX = 'skystack.v1.';
  const mem = {};
  let ok = false;
  try { localStorage.setItem(PREFIX + 'probe', '1'); localStorage.removeItem(PREFIX + 'probe'); ok = true; } catch (e) { ok = false; }
  return {
    get ok() { return ok; },
    get(key, fallback) {
      if (key in mem) return mem[key];
      if (ok) {
        try { const raw = localStorage.getItem(PREFIX + key); if (raw != null) return (mem[key] = JSON.parse(raw)); } catch (e) { /* ignore */ }
      }
      return fallback;
    },
    set(key, value) {
      mem[key] = value;
      if (!ok) return false;
      try { localStorage.setItem(PREFIX + key, JSON.stringify(value)); return true; } catch (e) { return false; }
    },
  };
})();

function cleanList(list) {
  if (!Array.isArray(list)) return [];
  return list.filter((e) => e && typeof e.s === 'number' && typeof e.n === 'string').slice(0, BOARD_SIZE);
}
const boards = (() => {
  const b = store.get('scores', null) || {};
  return { easy: cleanList(b.easy), normal: cleanList(b.normal) };
})();
const saveBoards = () => store.set('scores', boards);
function qualifyingRank(modeId, score) {
  if (score <= 0) return -1;
  const list = boards[modeId];
  let r = list.findIndex((e) => score > e.s);
  if (r === -1) r = list.length;
  return r < BOARD_SIZE ? r : -1;
}
function insertScore(modeId, entry) {
  const r = qualifyingRank(modeId, entry.s);
  if (r < 0) return -1;
  const list = boards[modeId];
  list.splice(r, 0, entry);
  if (list.length > BOARD_SIZE) list.length = BOARD_SIZE;
  saveBoards();
  return r;
}
let persistAsked = false;
function askPersist() {
  if (persistAsked) return;
  persistAsked = true;
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) { /* ignore */ }
}

/* ---------- sound (synthesized, no files) ---------- */
const sound = {
  ctx: null, out: null, noiseBuf: null, on: store.get('sound', true) !== false,
  ensure() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      try { this.ctx = new AC(); } catch (e) { return null; }
      this.out = this.ctx.createGain();
      this.out.gain.value = 0.55;
      this.out.connect(this.ctx.destination);
      const len = Math.floor(this.ctx.sampleRate * 0.6);
      this.noiseBuf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const d = this.noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    }
    if (this.ctx.state !== 'running') this.ctx.resume().catch(() => {});
    return this.ctx;
  },
  unlock() {
    const c = this.ensure();
    if (!c) return;
    try { const b = c.createBuffer(1, 1, 22050); const s = c.createBufferSource(); s.buffer = b; s.connect(c.destination); s.start(0); } catch (e) { /* ignore */ }
  },
  ready() { return this.on && this.ctx && this.ctx.state === 'running'; },
  tone(f, dur, o = {}) {
    if (!this.ready()) return;
    const { type = 'sine', vol = 0.25, at = 0, to = null, attack = 0.005 } = o;
    const c = this.ctx, t = c.currentTime + at;
    const osc = c.createOscillator(), g = c.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(f, t);
    if (to) osc.frequency.exponentialRampToValueAtTime(to, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g); g.connect(this.out);
    osc.start(t); osc.stop(t + dur + 0.03);
  },
  noise(dur, o = {}) {
    if (!this.ready()) return;
    const { vol = 0.2, at = 0, freq = 1200, q = 0.8, type = 'bandpass' } = o;
    const c = this.ctx, t = c.currentTime + at;
    const s = c.createBufferSource(); s.buffer = this.noiseBuf;
    const fl = c.createBiquadFilter(); fl.type = type; fl.frequency.value = freq; fl.Q.value = q;
    const g = c.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(fl); fl.connect(g); g.connect(this.out);
    s.start(t); s.stop(t + dur + 0.03);
  },
  place() { this.tone(150, 0.14, { vol: 0.5, to: 70 }); this.noise(0.05, { vol: 0.1, freq: 2600 }); },
  trim() { this.tone(125, 0.17, { type: 'triangle', vol: 0.42, to: 58 }); this.noise(0.2, { vol: 0.24, freq: 850, q: 0.6 }); },
  perfect(streak) {
    const notes = [523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1174.66, 1318.51, 1567.98, 1760];
    const f = notes[Math.min(streak - 1, notes.length - 1)];
    this.tone(f, 0.5, { vol: 0.3 });
    this.tone(f * 2, 0.28, { type: 'triangle', vol: 0.07 });
    this.tone(150, 0.12, { vol: 0.32, to: 80 });
  },
  grow() { this.tone(660, 0.16, { type: 'square', vol: 0.05, at: 0.06, to: 1320 }); },
  miss() { this.tone(430, 0.65, { type: 'sawtooth', vol: 0.1, to: 70 }); this.noise(0.4, { vol: 0.14, freq: 480, at: 0.3 }); },
  over() { [392, 329.63, 261.63].forEach((f, i) => this.tone(f, 0.34, { type: 'triangle', vol: 0.24, at: 0.25 + i * 0.2 })); },
  complete() {
    [523.25, 659.25, 783.99, 1046.5, 1318.51].forEach((f, i) => this.tone(f, 0.5, { type: 'triangle', vol: 0.22, at: i * 0.11 }));
    this.tone(1046.5, 1.3, { vol: 0.16, at: 0.6 });
  },
  pop() { this.noise(0.3, { vol: 0.16, freq: 700, q: 0.5 }); this.tone(rand(500, 900), 0.18, { type: 'square', vol: 0.025, to: 200 }); },
  click() { this.tone(660, 0.06, { type: 'square', vol: 0.045 }); },
  blip(i) { this.tone(392 + i * 14, 0.05, { type: 'square', vol: 0.045 }); },
  saved() { [783.99, 1046.5].forEach((f, i) => this.tone(f, 0.25, { type: 'triangle', vol: 0.2, at: i * 0.09 })); },
};

/* ---------- canvas & camera ---------- */
const canvas = $('world');
const ctx = canvas.getContext('2d');
const view = { w: 1, h: 1, dpr: 1, s: 1 };
const cam = { x: 0, y: 0, z: 1 };            // y = world height at the bottom of the screen
const S = () => view.s * cam.z;
const sx = (x) => view.w / 2 + (x - cam.x) * S();
const sy = (y) => view.h - (y - cam.y) * S();
const env = { p: 0, top: [0, 0, 0], bot: [0, 0, 0], nf: 0, stars: 0, t: 0 };

/* ---------- world decoration ---------- */
const SKY_KEYS = [
  [0.00, '#86C8FF', '#DFF3FF'],
  [0.30, '#3F9BFF', '#AEE0FF'],
  [0.52, '#5F6FE0', '#FFC78E'],
  [0.70, '#3B2D7D', '#FF8C6E'],
  [0.85, '#141A4F', '#4B3588'],
  [1.00, '#03051A', '#141C55'],
].map(([p, a, b]) => [p, hexRgb(a), hexRgb(b)]);
function skyAt(p) {
  for (let i = 1; i < SKY_KEYS.length; i++) {
    const [p1, a1, b1] = SKY_KEYS[i];
    if (p <= p1) {
      const [p0, a0, b0] = SKY_KEYS[i - 1];
      const t = (p - p0) / (p1 - p0);
      return [mix(a0, a1, t), mix(b0, b1, t)];
    }
  }
  const last = SKY_KEYS[SKY_KEYS.length - 1];
  return [last[1], last[2]];
}
const stars = Array.from({ length: 150 }, (_, i) => { const r = mulberry32(1000 + i); return { x: r(), y: r(), s: 0.7 + r() * 1.6, ph: r() * 6.28 }; });
function genSkyline(seed, minH, maxH, minW, maxW) {
  const r = mulberry32(seed);
  const out = [];
  let x = -1100;
  while (x < 1100) {
    const w = lerp(minW, maxW, r());
    out.push({ x, w, h: lerp(minH, maxH, Math.pow(r(), 1.3)), seed: (r() * 1e6) | 0, mast: r() > 0.82 });
    x += w + lerp(1, 7, r());
  }
  return out;
}
const skyFar = genSkyline(11, 45, 150, 16, 36);
const skyNear = genSkyline(29, 22, 100, 14, 30);
let clouds = [];
function genClouds(floors) {
  const topY = LOBBY_H + floors * FH;
  const r = mulberry32(77 + floors);
  const n = 18;
  clouds = [];
  for (let i = 0; i < n; i++) {
    const puffs = [];
    const k = 3 + Math.floor(r() * 3);
    for (let j = 0; j < k; j++) puffs.push({ dx: (j - (k - 1) / 2) * lerp(7, 10, r()), dy: lerp(-2, 3, r()), r: lerp(6, 11, r()) });
    clouds.push({ x: lerp(-330, 330, r()), y: lerp(95, topY * 0.94, (i + r()) / n), v: lerp(2, 6, r()) * (r() < 0.5 ? -1 : 1), s: lerp(0.8, 1.5, r()), puffs });
  }
}

/* ---------- game state ---------- */
const LOBBY = { x: -50, w: 100, ox: -50 };
const game = {
  phase: 'menu',              // menu | play | pause | ending | results
  mode: MODES.easy,
  floors: [], block: null, pieces: [], sparks: [], popups: [], confetti: [], fireworks: [], shells: [],
  score: 0, perfects: 0, perfectBonus: 0, topBonus: 0, streak: 0, bestStreak: 0, lives: 1,
  completed: false, roof: null,
  time: 0, clock: 0, spawnIn: 0, endIn: 0, shake: 0,
  sky: MENU_SKY, hueSteps: 50, camTween: null, drops: 0,
};
const floorY = (n) => LOBBY_H + n * FH;      // bottom of floor index n (0-based)
const topFloor = () => (game.floors.length ? game.floors[game.floors.length - 1] : LOBBY);
const hueFor = (n) => (205 + n * (340 / game.hueSteps)) % 360;
function speedFor(n) {
  const m = game.mode;
  return lerp(m.speedStart, m.speedEnd, clamp(n / m.floors, 0, 1));
}
function perfectWindow(w) { return Math.min(game.mode.perfect, w * 0.6); }

/* Move the floor along its swing. Same function is used for each frame and
   to catch up to the exact moment of a tap. */
function advance(b, dt) {
  const m = game.mode;
  const target = topFloor().x;
  let v = speedFor(game.floors.length);
  if (m.magnet) {
    const q = clamp(game.floors.length / m.floors, 0, 1);
    const lo = lerp(m.magnet.slowStart, m.magnet.slowEnd, q);
    v *= lo + (1 - lo) * smoothstep(0, m.magnet.radius, Math.abs(b.x - target));
  }
  const step = b.dir * v * dt;
  b.x += step; b.ox += step;
  const off = b.x - target;
  if (off > SWING) { const d = 2 * (off - SWING); b.x -= d; b.ox -= d; b.dir = -1; }
  else if (off < -SWING) { const d = 2 * (-SWING - off); b.x += d; b.ox += d; b.dir = 1; }
}

function spawnBlock() {
  const top = topFloor();
  const n = game.floors.length;
  const dir = n % 2 === 0 ? 1 : -1;            // alternate sides
  const x = top.x - dir * SWING;
  const b = { x, w: top.w, ox: x + (top.ox - top.x), dir, born: game.time, enter: 0, enterDist: 0 };
  const half = view.w / 2 / view.s;
  const edgeX = dir > 0 ? cam.x - half - b.w - 4 : cam.x + half + 4;
  b.enterDist = Math.max(0, dir > 0 ? x - edgeX : edgeX - x);
  game.block = b;
}

let lastFrameTs = 0;
function drop(now) {
  if (game.phase !== 'play') return;
  const b = game.block;
  if (!b || game.time - b.born < TAP_COOLDOWN) return;
  if (now && lastFrameTs) {
    const extra = clamp((now - lastFrameTs) / 1000, 0, 0.05);
    if (extra > 0) advance(b, extra);
  }
  const m = game.mode;
  const top = topFloor();
  const n = game.floors.length;
  const y = floorY(n);
  const off = b.x - top.x;
  const ad = Math.abs(off);
  game.block = null;
  game.drops++;
  if (game.drops >= 2) hideHint();

  if (ad <= perfectWindow(b.w)) {
    // Perfect: snap into place, maybe regrow.
    b.ox += top.x - b.x; b.x = top.x;
    game.streak++; game.perfects++;
    game.bestStreak = Math.max(game.bestStreak, game.streak);
    let grew = false;
    if (game.streak >= m.growAfter && b.w < BASE_W) {
      const nw = Math.min(BASE_W, b.w + m.grow);
      b.x -= (nw - b.w) / 2; b.w = nw; grew = true;
    }
    placeFloor(b, n, true);
    const mult = Math.min(game.streak, POINTS.maxMultiplier);
    const bonus = POINTS.perfect * mult;
    game.perfectBonus += bonus;
    game.score += POINTS.floor + bonus;
    game.popups.push({ ring: true, x: b.x, y, w: b.w, t: 0, life: 0.55 });
    if (grew) game.popups.push({ ring: true, x: b.x, y, w: b.w, t: -0.12, life: 0.55 });
    popup(game.streak > 1 ? `Perfect ×${mult}` : 'Perfect!', b.x + b.w / 2, y + FH + 4, '#FFD23F', 1);
    sparkle(b.x + b.w / 2, y + FH, b.w, 14, '#FFF3B0');
    sound.perfect(game.streak);
    if (grew) sound.grow();
  } else if (ad >= b.w) {
    // Missed the tower completely.
    game.streak = 0;
    game.pieces.push(makePiece(b.x, b.w, y, n, b.ox - b.x, off > 0 ? 1 : -1, true));
    sound.miss();
    game.shake = 0.35;
    game.lives--;
    renderHearts(true);
    if (game.lives > 0) {
      popup(game.lives === 1 ? 'Last heart!' : 'Oops! Try again', top.x + top.w / 2, y + FH + 6, '#FF8FA3', 1);
      game.spawnIn = 0.75;
    } else {
      gameOver();
    }
    return;
  } else {
    // Partly over: trim the overhang and let it fall.
    const L = Math.max(b.x, top.x);
    const R = Math.min(b.x + b.w, top.x + top.w);
    const side = off > 0 ? 1 : -1;
    const cutX = side > 0 ? R : b.x;
    const cutW = side > 0 ? b.x + b.w - R : L - b.x;
    game.pieces.push(makePiece(cutX, cutW, y, n, b.ox - cutX, side, false));
    b.x = L; b.w = R - L;
    game.streak = 0;
    placeFloor(b, n, false);
    game.score += POINTS.floor;
    dust(side > 0 ? R : L, y + FH / 2);
    sound.trim();
  }

  if (game.floors.length >= m.floors) { completeTower(); return; }
  const left = m.floors - game.floors.length;
  const t = topFloor();
  if (left === 10) popup('10 to go!', t.x + t.w / 2, y + FH * 2.6, '#7CF0C0', 1.15);
  else if (left === 1) popup('Last floor!', t.x + t.w / 2, y + FH * 2.6, '#7CF0C0', 1.15);
  game.spawnIn = 0.0001;
  updateHUD(true);
}

function placeFloor(b, n, perfect) {
  game.floors.push({ x: b.x, w: b.w, ox: b.ox, flash: perfect ? 1 : 0.35 });
}
function makePiece(x, w, y, n, rel, side, whole) {
  return { x, w, y, n, rel, vx: side * (whole ? 18 : 14), vy: whole ? -4 : 6, rot: 0, vr: side * rand(1.3, 2.6), t: 0 };
}
function popup(text, x, y, color, scale) {
  // a new message quickly clears older ones so fast stacking stays readable
  for (const p of game.popups) if (!p.ring && p.t >= 0) p.life = Math.min(p.life, p.t + 0.18);
  game.popups.push({ text, x, y, color, scale: scale || 1, t: 0, life: 1.05 });
}
function sparkle(x, y, w, count, color) {
  for (let i = 0; i < count; i++) {
    game.sparks.push({ x: x + rand(-w / 2, w / 2), y: y + rand(0, 3), vx: rand(-25, 25), vy: rand(20, 60), t: 0, life: rand(0.4, 0.75), size: rand(1.2, 2.4), color });
  }
}
function dust(x, y) {
  for (let i = 0; i < 9; i++) {
    game.sparks.push({ x, y: y + rand(-FH / 2, FH / 2), vx: rand(-20, 20), vy: rand(-10, 30), t: 0, life: rand(0.35, 0.7), size: rand(1, 2.2), color: 'rgba(235,235,245,0.9)' });
  }
}

function completeTower() {
  game.completed = true;
  const top = topFloor();
  const pct = Math.round((top.w / BASE_W) * 100);
  game.topBonus = POINTS.topOut + pct * POINTS.perWidthPct + (game.mode.lives > 1 ? game.lives * POINTS.perHeart : 0);
  game.score += game.topBonus;
  game.roof = { t: 0 };
  game.phase = 'ending';
  game.endIn = 2.6;
  hideHint();
  popup('Tower complete!', top.x + top.w / 2, floorY(game.floors.length) + FH * 3.4, '#FFD23F', 1.35);
  sound.complete();
  launchCelebration();
  updateHUD(true);
}
function gameOver() {
  game.phase = 'ending';
  game.endIn = 1.35;
  hideHint();
  sound.over();
  updateHUD(false);
}

function launchCelebration() {
  const { w, h } = view;
  const colors = ['#FFD23F', '#FF6B2C', '#2FD08A', '#5FB4FF', '#FF4F6D', '#C77DFF', '#FFFFFF'];
  const count = reduceMotion ? 50 : 150;
  for (let i = 0; i < count; i++) {
    game.confetti.push({ x: rand(0, w), y: rand(-h * 0.35, -10), vx: rand(-50, 50), vy: rand(70, 220), rot: rand(0, 6.28), vr: rand(-7, 7), w: rand(6, 11), h: rand(3, 6), color: colors[i % colors.length], t: 0, life: rand(2.6, 4.2) });
  }
  if (!reduceMotion) for (let i = 0; i < 7; i++) game.shells.push({ at: 0.25 + i * 0.38 + rand(-0.08, 0.08) });
}
function burstFirework() {
  const { w, h } = view;
  const x = rand(w * 0.12, w * 0.88), y = rand(h * 0.12, h * 0.42);
  const hues = [48, 18, 152, 210, 340, 280];
  const hue = hues[(Math.random() * hues.length) | 0];
  for (let i = 0; i < 44; i++) {
    const a = (i / 44) * Math.PI * 2 + rand(-0.05, 0.05);
    const sp = rand(90, 220);
    game.fireworks.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, t: 0, life: rand(1, 1.5), color: `hsl(${hue + rand(-12, 12)},100%,${rand(62, 78)}%)` });
  }
  sound.pop();
}

/* ---------- flow ---------- */
function resetWorld() {
  game.floors = []; game.block = null; game.pieces = []; game.sparks = []; game.popups = [];
  game.confetti = []; game.fireworks = []; game.shells = [];

/* ---------- camera ---------- */
function playCamTarget() {
  const by = floorY(game.floors.length) + FH / 2;
  const minY = -(view.h * 0.13) / view.s;
  const top = topFloor();
  return { x: (top.x + top.w / 2) * 0.8, y: Math.max(minY, by - (view.h * 0.58) / view.s), z: 1 };
}
function menuCamTarget() { return { x: 0, y: -(view.h * 0.05) / view.s, z: 1 }; }

function updateCamera(dt) {
  if (game.camTween) {
    const tw = game.camTween;
    tw.t = Math.min(tw.dur, tw.t + dt);
    const k = easeInOutCubic(tw.t / tw.dur);
    cam.x = lerp(tw.from.x, tw.to.x, k); cam.y = lerp(tw.from.y, tw.to.y, k); cam.z = lerp(tw.from.z, tw.to.z, k);
    return;
  }
  const t = game.phase === 'menu' ? menuCamTarget() : playCamTarget();
  const k = 1 - Math.exp(-dt * 5);
  cam.x += (t.x - cam.x) * k; cam.y += (t.y - cam.y) * k; cam.z += (t.z - cam.z) * k;
}
const probe = document.createElement('div');
probe.style.cssText = 'position:fixed;top:0;left:0;width:0;height:0;padding-top:env(safe-area-inset-top);visibility:hidden;pointer-events:none';
document.body.appendChild(probe);
const safeTop = () => parseFloat(getComputedStyle(probe).paddingTop) || 0;

/* Zoom out so the whole tower fits in the space the results panel leaves free. */
function frameOverview(dur) {
  const panel = ui.resultsPanel;
  let rx = 0, ry = safeTop() + 8, rw = view.w, rh = view.h - ry;
  if (!ui.results.hidden) {
    if (panel.offsetLeft > view.w * 0.3) rw = panel.offsetLeft;
    else rh = Math.max(60, panel.offsetTop - ry);
  }
  const pad = 16;
  const towerTop = floorY(game.floors.length) + (game.completed ? 44 : 6);
  const yMin = -16;
  const sc = clamp(Math.min((rh - pad * 2) / (towerTop - yMin), (rw - pad * 2) / 160), 0.04, view.s);
  const bottomPx = ry + rh - pad;
  tweenCam({ x: (view.w / 2 - (rx + rw / 2)) / sc, y: yMin - (view.h - bottomPx) / sc, z: sc / view.s }, dur);
}

/* ---------- update ---------- */
function update(dt) {
  game.clock += dt;
  if (game.phase === 'pause') return;
  game.time += dt;
  if (game.phase === 'play') {
    if (!game.block && game.spawnIn > 0) {
      game.spawnIn -= dt;
      if (game.spawnIn <= 0) spawnBlock();
    }
    if (game.block) { game.block.enter += dt; advance(game.block, dt); }
  } else if (game.phase === 'ending') {
    game.endIn -= dt;
    if (game.endIn <= 0) showResults();
  }
  const skyTarget = game.phase === 'menu' ? MENU_SKY : game.floors.length / game.mode.floors;
  game.sky += (skyTarget - game.sky) * (1 - Math.exp(-dt * 1.6));
  game.shake = Math.max(0, game.shake - dt);
  if (game.roof) game.roof.t = Math.min(1, game.roof.t + dt / 0.6);

  for (const c of clouds) { c.x += c.v * dt; if (c.x > 360) c.x -= 720; else if (c.x < -360) c.x += 720; }
  for (const f of game.floors) if (f.flash > 0) f.flash = Math.max(0, f.flash - dt * 2.6);

  game.pieces = game.pieces.filter((p) => {
    p.t += dt; p.vy -= 330 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
    return p.t < 3.5 && p.y > cam.y - 400;
  });
  game.sparks = game.sparks.filter((s) => { s.t += dt; s.vy -= 120 * dt; s.x += s.vx * dt; s.y += s.vy * dt; return s.t < s.life; });
  game.popups = game.popups.filter((p) => { p.t += dt; return p.t < p.life; });
  game.confetti = game.confetti.filter((c) => {
    c.t += dt; c.vy += 40 * dt; c.x += (c.vx + Math.sin(c.t * 3 + c.rot) * 30) * dt; c.y += c.vy * dt; c.rot += c.vr * dt;
    return c.t < c.life && c.y < view.h + 20;
  });
  game.fireworks = game.fireworks.filter((f) => { f.t += dt; f.vy += 130 * dt; f.vx *= 0.985; f.vy *= 0.985; f.x += f.vx * dt; f.y += f.vy * dt; return f.t < f.life; });
  if (game.shells.length) {
    for (const s of game.shells) { s.at -= dt; if (s.at <= 0) { s.done = true; burstFirework(); } }

  }
  updateCamera(dt);
}

/* ---------- drawing ---------- */
const WIN_SPACING = 12.5, WIN_W = 7, WIN_Y0 = 3.8, WIN_H = 9.4, SLAB = 2.6;
function paintFloor(X, Y, W, sc, n, rel) {
  const H = FH * sc;
  const hue = hueFor(n);
  const L = 58 - 20 * env.nf;
  ctx.fillStyle = hsla(hue, 60, L);
  ctx.fillRect(X, Y, W, H);
  ctx.fillStyle = hsla(hue, 72, Math.min(90, L + 16));
  ctx.fillRect(X, Y, W, SLAB * sc);
  ctx.fillStyle = 'rgba(0,0,0,0.16)';
  ctx.fillRect(X, Y + H - 1.6 * sc, W, 1.6 * sc);
  if (WIN_W * sc < 0.8) return;
  const wu = W / sc;
  const c0 = Math.floor(-rel / WIN_SPACING) - 1;
  const c1 = Math.ceil((wu - rel) / WIN_SPACING) + 1;
  const wy = Y + H - (WIN_Y0 + WIN_H) * sc;
  const wh = WIN_H * sc;
  const rects = [];
  for (let c = c0; c <= c1; c++) {
    const wx = rel + c * WIN_SPACING + (WIN_SPACING - WIN_W) / 2;
    const a = Math.max(wx, 1.2), b = Math.min(wx + WIN_W, wu - 1.2);
    if (b - a < 0.6) continue;
    rects.push(a, b, c);
  }
  ctx.fillStyle = hsla(hue, 45, 24 + 10 * (1 - env.nf));
  for (let i = 0; i < rects.length; i += 3) ctx.fillRect(X + rects[i] * sc, wy, (rects[i + 1] - rects[i]) * sc, wh);
  if (env.nf < 0.95) {
    ctx.fillStyle = `rgba(255,255,255,${0.2 * (1 - env.nf)})`;
    for (let i = 0; i < rects.length; i += 3) ctx.fillRect(X + rects[i] * sc, wy, (rects[i + 1] - rects[i]) * sc, 1.7 * sc);
  }
  if (env.nf > 0.01) {
    // lights switch on early in the dusk so they read as lit, not muddy
    ctx.fillStyle = `rgba(255,214,120,${0.96 * smoothstep(0, 0.35, env.nf)})`;
    for (let i = 0; i < rects.length; i += 3) {
      if (hash2(n, rects[i + 2]) < 0.62) ctx.fillRect(X + rects[i] * sc, wy, (rects[i + 1] - rects[i]) * sc, wh);
    }
  }
}

function drawSky() {
  const g = ctx.createLinearGradient(0, 0, 0, view.h);
  g.addColorStop(0, rgba(env.top));
  g.addColorStop(1, rgba(env.bot));
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, view.w, view.h);
}
function drawStars() {

    ctx.fillStyle = `rgba(244,241,228,${moonA})`;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = `rgba(150,150,170,${0.35 * moonA})`;
    ctx.beginPath(); ctx.arc(x - r * 0.3, y - r * 0.2, r * 0.22, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(x + r * 0.35, y + r * 0.3, r * 0.14, 0, Math.PI * 2); ctx.fill();

function drawSkyLayer(list, pf, color, windows) {
  const sc = S();

  const cx = view.w / 2 - cam.x * pf * sc;
  ctx.fillStyle = color;
  for (const b of list) {
    const X = cx + b.x * sc, W = b.w * sc;
    if (X + W < 0 || X > view.w) continue;
    const H = b.h * sc;
    ctx.fillRect(X, base - H, W + 0.5, H + 2);
    if (b.mast) ctx.fillRect(X + W * 0.46, base - H - 9 * sc, Math.max(1, sc * 0.9), 9 * sc);
  }
  if (!windows || env.nf < 0.02) return;
  ctx.fillStyle = `rgba(255,214,130,${0.85 * env.nf})`;
  for (const b of list) {
    const X = cx + b.x * sc, W = b.w * sc;
    if (X + W < 0 || X > view.w) continue;
    const cols = Math.max(1, Math.floor((b.w - 3) / 5)), rows = Math.floor((b.h - 4) / 6);

}
function drawClouds() {

  ctx.fillStyle = rgba(col, lerp(0.9, 0.5, env.nf));
  for (const c of clouds) {
    const X = view.w / 2 + (c.x - cam.x * pf) * sc;
    const Y = view.h - (c.y - cam.y * pf) * sc;
    if (Y < -40 * sc || Y > view.h + 40 * sc || X < -80 * sc || X > view.w + 80 * sc) continue;

function drawRoof() {

function drawMoving() {

      const g = 10 * easeOutCubic(k);
      ctx.lineWidth = Math.max(2, 1.6 * sc);
      ctx.strokeStyle = `rgba(255,255,255,${1 - k})`;
      ctx.strokeRect(sx(p.x - g), sy(p.y + FH + g), (p.w + g * 2) * sc, (FH + g * 2) * sc);
      continue;
    }
    const size = clamp(7.5 * sc, 17, 40) * p.scale * (k < 0.15 ? lerp(1.35, 1, k / 0.15) : 1);
    const X = sx(p.x), Y = sy(p.y + 18 * easeOutCubic(k));
    ctx.globalAlpha = 1 - smoothstep(0.6, 1, k);
    ctx.font = `${size.toFixed(1)}px Bungee, "Arial Black", sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = 'rgba(6,8,26,0.75)';
    ctx.fillText(p.text.toUpperCase(), X + 2, Y + 3);
    ctx.fillStyle = p.color;
    ctx.fillText(p.text.toUpperCase(), X, Y);
    ctx.globalAlpha = 1;
  }
}
function drawScreenFx() {
  for (const c of game.confetti) {
    ctx.save();
    ctx.globalAlpha = 1 - smoothstep(c.life - 0.6, c.life, c.t);
    ctx.translate(c.x, c.y);
    ctx.rotate(c.rot);
    ctx.fillStyle = c.color;
    ctx.fillRect(-c.w / 2, -c.h / 2, c.w, c.h * Math.abs(Math.cos(c.t * 5 + c.rot)) + 1);
    ctx.restore();
  }
  for (const f of game.fireworks) {
    ctx.globalAlpha = 1 - f.t / f.life;
    ctx.fillStyle = f.color;
    ctx.fillRect(f.x - 1.5, f.y - 1.5, 3, 3);
  }
  ctx.globalAlpha = 1;
}
function render() {
  ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
  const p = clamp(game.sky, 0, 1);
  const [top, bot] = skyAt(p);
  env.p = p; env.top = top; env.bot = bot; env.t = game.clock;
  env.nf = smoothstep(0.6, 0.9, p);
  env.stars = smoothstep(0.68, 0.98, p);
  drawSky();
  drawStars();
  drawSunMoon();
  let ox = 0, oy = 0;
  if (game.shake > 0 && !reduceMotion) { const a = 12 * game.shake; ox = rand(-a, a); oy = rand(-a, a); }
  ctx.save();
  ctx.translate(ox, oy);
  drawSkyLayer(skyFar, 0.35, rgba(mix(env.bot, [40, 52, 112], 0.38 + 0.32 * env.nf)), false);
  drawClouds();
  drawSkyLayer(skyNear, 0.6, rgba(mix(env.bot, [24, 30, 78], 0.58 + 0.3 * env.nf)), true);
  drawGround();
  drawLobby();
  drawTower();
  drawRoof();
  drawMoving();
  drawPieces();
  drawSparks();
  drawPopups();
  ctx.restore();
  drawScreenFx();
}

/* ---------- UI ---------- */
const ui = {
  hud: $('hud'), pauseBtn: $('btnPause'), hudScore: $('hudScore'), hudFloor: $('hudFloor'), hudTarget: $('hudTarget'),
  hudMeter: $('hudMeter'), hudHearts: $('hudHearts'), hudArrow: $('hudArrow'), hint: $('hint'),
  menu: $('menu'), pause: $('pause'), results: $('results'), resultsPanel: $('resultsPanel'), scores: $('scores'),
  entry: $('entry'), initials: $('initials'), miniBoard: $('miniBoard'), resActions: $('resActions'), resNote: $('resNote'),
  board: $('board'), soundBtn: $('btnSound'),
};
const screens = [ui.menu, ui.pause, ui.results, ui.scores];
function showScreen(el) { for (const s of screens) s.hidden = s !== el; }
function bump(el) { el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }

function updateHUD(pop) {
  const n = game.floors.length;
  ui.hudFloor.textContent = String(n);
  ui.hudScore.textContent = fmt(game.score);
  ui.hudMeter.style.transform = `scaleX(${clamp(n / game.mode.floors, 0, 1)})`;
  if (pop) {
    bump(ui.hudFloor); bump(ui.hudScore);
    ui.hudArrow.classList.add('on');
    clearTimeout(updateHUD.timer);
    updateHUD.timer = setTimeout(() => ui.hudArrow.classList.remove('on'), 380);
  }
}
const HEART = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21.3s-7.6-4.7-9.7-9.4C.8 8.5 2.9 4.4 6.7 4.4c2.2 0 3.7 1.2 4.6 2.7.9-1.5 2.4-2.7 4.6-2.7 3.8 0 5.9 4.1 4.4 7.5-2.1 4.7-8.3 9.4-8.3 9.4z"/></svg>';
function renderHearts(pop) {
  const m = game.mode;
  const box = ui.hudHearts;
  if (m.lives <= 1) { box.hidden = true; return; }
  box.hidden = false;
  if (box.childElementCount !== m.lives) box.innerHTML = Array.from({ length: m.lives }, () => `<i class="heart">${HEART}</i>`).join('');
  [...box.children].forEach((el, i) => el.classList.toggle('lost', i >= game.lives));
  box.setAttribute('aria-label', `${game.lives} ${game.lives === 1 ? 'heart' : 'hearts'} left`);
  if (pop && box.children[game.lives]) bump(box.children[game.lives]);
}
let hintTimer = 0;
function showHint(text) {
  ui.hint.textContent = text;
  ui.hint.hidden = false;
  ui.hint.classList.remove('fade');
  clearTimeout(hintTimer);
  hintTimer = setTimeout(() => hideHint(), 9000);
}
function hideHint(now) {
  clearTimeout(hintTimer);
  if (now) { ui.hint.hidden = true; return; }
  if (ui.hint.hidden) return;
  ui.hint.classList.add('fade');
  hintTimer = setTimeout(() => { ui.hint.hidden = true; }, 420);
}
function refreshBests() {
  for (const id of ['easy', 'normal']) {
    const el = $(id === 'easy' ? 'bestEasy' : 'bestNormal');
    const best = boards[id][0];
    el.textContent = best ? `Best ${fmt(best.s)} by ${best.n}` : 'No high score yet';
  }
}

/* results + arcade initials */
const ALPHABET = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
let letters = ['A', 'A', 'A'];
let slot = 0;
const UP = '<svg viewBox="0 0 18 14" aria-hidden="true"><path d="M9 0l9 14H0z"/></svg>';
const DOWN = '<svg viewBox="0 0 18 14" aria-hidden="true"><path d="M9 14L0 0h18z"/></svg>';
function buildInitials() {
  ui.initials.innerHTML = [0, 1, 2].map((i) => `
    <div class="slot" data-i="${i}">
      <button class="arrow" data-i="${i}" data-step="1" aria-label="Letter ${i + 1}: next">${UP}</button>
      <button class="letter" data-i="${i}" aria-label="Letter ${i + 1}"><span>A</span></button>
      <button class="arrow" data-i="${i}" data-step="-1" aria-label="Letter ${i + 1}: previous">${DOWN}</button>
    </div>`).join('');
  ui.initials.querySelectorAll('.arrow').forEach((btn) => {
    const i = +btn.dataset.i, d = +btn.dataset.step;
    holdRepeat(btn, () => stepLetter(i, d));
  });
  ui.initials.querySelectorAll('.letter').forEach((btn) => {
    btn.addEventListener('click', () => { slot = +btn.dataset.i; renderInitials(); sound.click(); });
  });
}
function holdRepeat(btn, fn) {
  let t1 = 0, t2 = 0;
  const stop = () => { clearTimeout(t1); clearInterval(t2); };
  btn.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    stop(); fn();
    t1 = setTimeout(() => { t2 = setInterval(fn, 85); }, 380);
  });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach((ev) => btn.addEventListener(ev, stop));
  btn.addEventListener('click', (e) => { if (e.detail === 0) fn(); });   // keyboard activation
  btn.addEventListener('contextmenu', (e) => e.preventDefault());
}
function stepLetter(i, d) {
  slot = i;
  const idx = ALPHABET.indexOf(letters[i]);
  letters[i] = ALPHABET[(idx + d + ALPHABET.length) % ALPHABET.length];
  renderInitials();
  sound.blip(ALPHABET.indexOf(letters[i]));
}
function renderInitials() {
  ui.initials.querySelectorAll('.slot').forEach((el, i) => {
    el.classList.toggle('active', i === slot);
    el.querySelector('.letter span').textContent = letters[i];
  });
}
function showResults() {
  game.phase = 'results';
  ui.hud.hidden = true;
  hideHint(true);
  const m = game.mode;
  $('resTitle').textContent = game.completed ? 'Tower complete!' : (m.lives > 1 ? 'Out of hearts' : 'Game over');
  $('resScore').textContent = fmt(game.score);
  $('resFloors').textContent = `${game.floors.length}`;
  $('resFloorsPts').textContent = `+${fmt(game.floors.length * POINTS.floor)}`;
  $('resPerfect').textContent = `${game.perfects}`;
  $('resPerfectPts').textContent = `+${fmt(game.perfectBonus)}`;
  $('resTop').textContent = game.completed ? `${Math.round((topFloor().w / BASE_W) * 100)}%` : '–';
  $('resTopPts').textContent = game.completed ? `+${fmt(game.topBonus)}` : ' ';
  const rank = qualifyingRank(m.id, game.score);
  ui.miniBoard.hidden = true;
  if (rank >= 0) {
    $('entryRank').textContent = `#${rank + 1}`;
    const saved = String(store.get('initials', 'AAA') || 'AAA').toUpperCase().replace(/[^A-Z0-9]/g, '');
    letters = (saved + 'AAA').slice(0, 3).split('');
    slot = 0;
    renderInitials();
    ui.entry.hidden = false;
    ui.resActions.hidden = true;
    ui.resNote.hidden = true;
  } else {
    ui.entry.hidden = true;
    ui.resActions.hidden = false;
    const best = boards[m.id][0];
    ui.resNote.textContent = best ? `${m.name} best: ${fmt(best.s)} by ${best.n}` : '';
    ui.resNote.hidden = !best;
  }
  showScreen(ui.results);
  requestAnimationFrame(() => frameOverview(1.6));
}
function saveEntry() {
  if (ui.entry.hidden || game.phase !== 'results') return;
  const name = letters.join('');
  store.set('initials', name);
  const m = game.mode;
  const rank = insertScore(m.id, { n: name, s: game.score, f: game.floors.length, p: game.perfects, c: game.completed ? 1 : 0, d: Date.now() });
  askPersist();
  ui.entry.hidden = true;
  renderBoard(ui.miniBoard, m.id, rank, false);
  ui.miniBoard.hidden = false;
  ui.resNote.textContent = store.ok ? `Saved to the ${m.name} board.` : 'Saved until this page closes. This browser is blocking storage.';
  ui.resNote.hidden = false;
  ui.resActions.hidden = false;
  sound.saved();
  refreshBests();
  requestAnimationFrame(() => frameOverview(0.5));
}
function skipEntry() {
  if (ui.entry.hidden) return;
  ui.entry.hidden = true;
  ui.resActions.hidden = false;
  requestAnimationFrame(() => frameOverview(0.5));
}

/* leaderboard */
let scoresTab = 'easy';
let resetArmed = 0;
function renderBoard(ol, modeId, highlight = -1, fill = true) {
  const list = boards[modeId];
  ol.textContent = '';
  const rows = fill ? BOARD_SIZE : list.length;
  for (let i = 0; i < rows; i++) {
    const e = list[i];
    const li = document.createElement('li');
    if (i < 3 && e) li.classList.add(`r${i + 1}`);
    if (!e) li.classList.add('empty');
    if (i === highlight) li.classList.add('new');
    const cells = [
      ['rk', String(i + 1)],
      ['nm', e ? e.n : '---'],
      ['sc', e ? fmt(e.s) : ''],
      ['fl', e ? String(e.f) : ''],
    ];
    for (const [cls, text] of cells) {
      const span = document.createElement('span');
      span.className = cls;
      span.textContent = text;
      if (cls === 'fl' && e && e.c) { const star = document.createElement('b'); star.textContent = '★'; star.title = 'Finished the tower'; span.appendChild(star); }
      li.appendChild(span);
    }
    ol.appendChild(li);
  }
}
function openScores(tab) {
  scoresTab = tab || scoresTab;
  disarmReset();
  renderScoresTab();
  showScreen(ui.scores);
}
function renderScoresTab() {
  document.querySelectorAll('.tab').forEach((t) => t.setAttribute('aria-selected', String(t.dataset.tab === scoresTab)));
  renderBoard(ui.board, scoresTab);
  $('btnReset').textContent = `Clear ${MODES[scoresTab].name} scores`;
  $('btnReset').hidden = boards[scoresTab].length === 0;
  $('storageNote').textContent = store.ok ? 'Scores are saved on this device.' : 'This browser is blocking storage, so scores last until the page closes.';
}
function disarmReset() {
  clearTimeout(resetArmed); resetArmed = 0;
  $('btnReset').textContent = `Clear ${MODES[scoresTab].name} scores`;
}
let scoresReturn = 'menu';

/* ---------- input ---------- */
canvas.addEventListener('pointerdown', (e) => {
  if (game.phase === 'play') { e.preventDefault(); drop(performance.now()); }
});
canvas.addEventListener('touchstart', (e) => { e.preventDefault(); }, { passive: false });
canvas.addEventListener('contextmenu', (e) => e.preventDefault());
document.addEventListener('gesturestart', (e) => e.preventDefault());
document.addEventListener('dblclick', (e) => e.preventDefault());
// iOS only allows audio to start from a tap that ends (touchend/click)
['touchend', 'click', 'keydown'].forEach((ev) => document.addEventListener(ev, () => { if (sound.ctx && sound.ctx.state !== 'running') sound.ensure(); }, { passive: true }));

window.addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key;
  if (game.phase === 'play') {
    if (k === ' ' || k === 'Enter' || k === 'ArrowDown') { e.preventDefault(); if (!e.repeat) drop(performance.now()); }
    else if (k === 'Escape' || k === 'p' || k === 'P') { e.preventDefault(); pauseGame(); }
    return;
  }
  if (game.phase === 'pause') {
    if (k === 'Escape' || k === 'Enter' || k === ' ') { e.preventDefault(); resumeGame(); }
    return;
  }
  if (game.phase === 'results' && !ui.entry.hidden) {
    if (/^[a-z0-9]$/i.test(k)) { e.preventDefault(); letters[slot] = k.toUpperCase(); sound.blip(ALPHABET.indexOf(letters[slot])); slot = Math.min(2, slot + 1); renderInitials(); }
    else if (k === 'ArrowUp') { e.preventDefault(); stepLetter(slot, 1); }
    else if (k === 'ArrowDown') { e.preventDefault(); stepLetter(slot, -1); }
    else if (k === 'ArrowLeft' || k === 'Backspace') { e.preventDefault(); slot = Math.max(0, slot - 1); renderInitials(); }
    else if (k === 'ArrowRight') { e.preventDefault(); slot = Math.min(2, slot + 1); renderInitials(); }
    else if (k === 'Enter') { e.preventDefault(); saveEntry(); }
  }
});

document.querySelectorAll('.mode').forEach((btn) => btn.addEventListener('click', () => startGame(btn.dataset.mode)));
$('btnScores').addEventListener('click', () => { sound.unlock(); sound.click(); scoresReturn = 'menu'; openScores(); });
ui.soundBtn.addEventListener('click', () => {
  sound.on = !sound.on;
  store.set('sound', sound.on);
  ui.soundBtn.setAttribute('aria-pressed', String(sound.on));
  if (sound.on) { sound.unlock(); sound.click(); }
});
ui.pauseBtn.addEventListener('click', () => { pauseGame(); });
$('btnResume').addEventListener('click', () => { sound.click(); resumeGame(); });
$('btnQuit').addEventListener('click', () => { sound.click(); goMenu(); });
$('btnSave').addEventListener('click', saveEntry);
$('btnSkip').addEventListener('click', skipEntry);
$('btnAgain').addEventListener('click', () => startGame(game.mode.id));
$('btnMenu').addEventListener('click', () => { sound.click(); goMenu(); });
$('btnResScores').addEventListener('click', () => { sound.click(); scoresReturn = 'results'; openScores(game.mode.id); });
$('btnScoresBack').addEventListener('click', () => {
  sound.click();
  disarmReset();
  if (scoresReturn === 'results' && game.phase === 'results') { showScreen(ui.results); requestAnimationFrame(() => frameOverview(0.4)); }
  else goMenu();
});
document.querySelectorAll('.tab').forEach((t) => t.addEventListener('click', () => { sound.click(); scoresTab = t.dataset.tab; disarmReset(); renderScoresTab(); }));
$('btnReset').addEventListener('click', () => {
  const btn = $('btnReset');
  if (resetArmed) {
    boards[scoresTab] = [];
    saveBoards();
    disarmReset();
    renderScoresTab();
    refreshBests();
    return;
  }
  btn.textContent = 'Tap again to clear';
  resetArmed = setTimeout(disarmReset, 3000);
});
document.addEventListener('visibilitychange', () => { if (document.hidden && game.phase === 'play') pauseGame(); });

/* ---------- sizing & loop ---------- */
function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  view.w = w; view.h = h; view.dpr = dpr;
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  view.s = Math.min((w * 0.56) / BASE_W, h / (FH * 15), 4.2);
  if (game.phase === 'results') frameOverview(0.25);
  else if (game.phase === 'menu') { const t = menuCamTarget(); cam.x = t.x; cam.y = t.y; cam.z = 1; }
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 250));

let lastTs = 0;
function frame(ts) {
  const dt = lastTs ? Math.min(0.05, Math.max(0, (ts - lastTs) / 1000)) : 1 / 60;
  lastTs = ts;
  update(dt);
  lastFrameTs = performance.now();
  render();
  requestAnimationFrame(frame);
}

buildInitials();
ui.soundBtn.setAttribute('aria-pressed', String(sound.on));
resize();
goMenu();
if (document.fonts && document.fonts.load) { document.fonts.load('20px Bungee').catch(() => {}); }
requestAnimationFrame(frame);

if (/[?#&]debug\b/.test(location.href)) {
  window.__skystack = {
    game, MODES, boards, cam, view, store,
    drop: () => drop(performance.now()),
    dropAt(offset) { const b = game.block; if (!b) return false; b.born = -1; const t = topFloor(); const d = t.x + offset - b.x; b.x += d; b.ox += d; drop(0); return true; },
    startGame, goMenu,
  };
}
})();
</script>
</body>
