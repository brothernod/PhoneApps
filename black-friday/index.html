<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Black Friday">
  <meta name="theme-color" content="#F4F5F7" media="(prefers-color-scheme: light)">

  <title>Black Friday</title>

  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app" class="app" hidden>
    <header class="top">
      <div class="top-row">
        <h1 class="wordmark">Black Friday</h1>
        <span id="sync-dot" class="sync-dot" title="Synced"></span>
        <button id="btn-settings" class="icon-btn" type="button" aria-label="Settings">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7Zm7.43-2.53c.04-.32.07-.64.07-.97s-.03-.66-.07-1l2.11-1.63a.5.5 0 0 0 .12-.64l-2-3.46a.5.5 0 0 0-.61-.22l-2.49 1a7.3 7.3 0 0 0-1.69-.98l-.38-2.65A.49.49 0 0 0 14 2h-4a.49.49 0 0 0-.49.42l-.38 2.65c-.61.25-1.17.58-1.69.98l-2.49-1a.5.5 0 0 0-.61.22l-2 3.46a.49.49 0 0 0 .12.64L4.57 11c-.04.34-.07.67-.07 1s.03.65.07.97l-2.11 1.66a.49.49 0 0 0-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1.01c.52.4 1.08.74 1.69.99l.38 2.65c.04.24.25.42.49.42h4c.24 0 .45-.18.49-.42l.38-2.65a7.3 7.3 0 0 0 1.69-.99l2.49 1.01c.22.08.49 0 .61-.22l2-3.46a.5.5 0 0 0-.12-.64l-2.11-1.66Z"/></svg>
        </button>
      </div>
      <section id="tag" class="tag" aria-live="polite"></section>
    </header>

    <nav id="seg" class="seg" aria-label="Whose ranking"></nav>
    <main id="main" class="main"></main>

    <footer class="bar">
      <button type="button" class="bar-tab" data-tab="list">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M4 6.5h2v2H4zm4 .25h12v1.5H8zM4 11h2v2H4zm4 .25h12v1.5H8zM4 15.5h2v2H4zm4 .25h12v1.5H8z"/></svg>
        <span>List</span>
      </button>
      <button type="button" id="btn-add" class="add-btn" aria-label="Add an idea">
        <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><path fill="currentColor" d="M11 4h2v7h7v2h-7v7h-2v-7H4v-2h7z"/></svg>
      </button>
      <button type="button" class="bar-tab" data-tab="bought">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M6 2h12v20l-2-1.5L14 22l-2-1.5L10 22l-2-1.5L6 22V2Zm2 2v14.1l.0.0 0 0V4Zm1 3v1.5h6V7H9Zm0 3.5V12h6v-1.5H9Zm0 3.5v1.5h4V14H9Z"/></svg>
        <span>Bought</span>
      </button>
    </footer>
  </div>

  <div id="setup" class="setup" hidden></div>
  <div id="sheets"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="vendor/Sortable.min.js"></script>
  <script src="seed.js"></script>
  <script src="app.js"></script>
</body>
</html>
