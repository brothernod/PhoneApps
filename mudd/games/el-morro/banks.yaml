# Content banks for THE DRAGON OF EL MORRO.
# Edit freely. No code needed. Names in {braces} are filled in by the game:
#   {hero} {sibling} {pet} from game.yaml, plus any letters defined under "vars".
# A scene card picks a bank by topic: { puzzle: dragon_hoard, topic: piraguas }.

# Cheers for a right answer.
praise: ["¡CORRECTO!", "¡PERFECTO!", "¡MUY BIEN!", "¡EXCELENTE!"]

# ---------------------------------------------------------------------------
# WORDING: what each puzzle says around its question, so a puzzle can be
# reskinned without code. Anything left out uses the engine's plain wording.
wording:
  # Colores has three levels. Level 1 is one word. Level 2 is a sentence with
  # a color and a size. Level 3 says which colors it is NOT. {color}, {no1},
  # and {no2} are the f: forms from spanish.colors, to go with "la puerta".
  colores:
    ask: "The neighbor calls: ¡{es}! Which door is it?"
    prompt: "¡{es}! PICK A DOOR"
    retry: TRY ANOTHER DOOR
    option: DOOR
    right: "¡SÍ! {es} ({say}) means {en}."
    miss: "That door is {pick_es}, which means {pick_en}. HINT: {es} sounds like {say}. {hint}"
    reveal: "{es} means {en}. It's the {en} door!"
    ask2: "The neighbor calls: \"¡Toca la puerta {color} y {size}!\" Which door is it?"
    prompt2: PICK A DOOR
    right2: "¡SÍ! \"La puerta {color} y {size}\" is the {size_en} {color_en} door."
    reveal2: "\"La puerta {color} y {size}\" is the {size_en} {color_en} door."
    ask3: "The neighbor calls: \"¡No es {no1} ni {no2}! ¡Es {size}!\" Which door is it?"
    prompt3: PICK A DOOR
    right3: "¡SÍ! Not {no1_en}, not {no2_en}, and {size_en}."
    reveal3: "NO ES {no1} NI {no2}: not {no1_en}, not {no2_en}. ES {size}: it is {size_en}. That leaves the {size_en} {color_en} door."
    miss2: "That door is {pick_color} y {pick_size}: {pick_color_en} and {pick_size_en}. HINT: {hint}"
    hint_color: "{color} sounds like {say}. {hint}"
    hint_size: "{pick_size} means {pick_size_en}. You want {size}."
    hint_not: "NO ES {pick_color} means it is NOT {pick_color_en}."
  hola_y_gracias:
    who: Someone
    ask: "{who} says: \"{says}\" What do you say back?"
    ask_easy: "{who} says: \"{says}\" ({en}) What do you say back?"
    prompt: SAY IT IN SPANISH
    retry: TRY ANOTHER ONE
    right: "{praise} \"{says}\" means \"{en}\" You said: \"{reply_en}\""
    miss: "\"{pick_es}\" means \"{pick_en}\" HINT: {hint}"
    reveal: "\"{says}\" means \"{en}\" A good answer: \"{reply}\" ({reply_en})"
  sunset_clock:
    prompt: HOW MANY MINUTES?
    prompt_time: "TYPE THE TIME, LIKE 3:25"
  stepping_stones:
    prompt: TYPE THE MISSING NUMBER
  fact_or_fib:
    ask: "Two are TRUE. Which one is the FIB?"
    prompt: "{pet} SNIFFED OUT A FIB!"
    retry: TRY AGAIN
    right: "RIGHT! That's the fib. {pet} wags."
    miss: "That one is TRUE! HINT: {hint}"
    reveal: "That one is true too! The FIB was: \"{fib}\""
  snack_muncher:
    prompt: "TAP EVERY TREAT {pet} MAY EAT"
    retry: "FIX THE TRAY AND TRY AGAIN"
    done: "MUNCH!"
    right: "{praise} {pet} munches all {count}: {list}."
    miss_wrong: "{pet} spits out the {pick}. It doesn't fit! HINT: {hint}"
    miss_short: "{pet} ate those and is still hungry. There are more! HINT: {hint}"
    reveal: "{pet}'s treats were {list}. {explain}"
  egg_crates:
    prompt: TAP A SQUARE TO FILL THE TRAY
    caption_none: TAP A SQUARE
  dragon_census:
    prompt: TAP TO FILL IN THE ROW
  memoria:
    ask: "Match each Spanish word with its picture."
    ask_easy: "Match each word with its picture. The small print is the English."
    prompt: TURN OVER TWO CARDS
    right: "{praise} You matched all {pairs} pairs."
    hint: "{es} means {en}."
    hint_same: "Match a WORD card with a PICTURE card."
    reveal: "Here they all are. {list}."
  rescue:
    ask: "{goal} What do you say?"
    prompt: SAY IT IN SPANISH
    retry: TRY ANOTHER ONE
    right: "{praise} \"{es}\" means \"{en}\""
    miss: "\"{pick_es}\" means \"{pick_en}\" {oops} HINT: {hint}"
    reveal: "\"{es}\" means \"{en}\""
  code_lock:
    ask: "The nest case is LOCKED. Type your lock numbers, in the order you found them."
    prompt: TYPE THE CODE
    retry: TRY AGAIN
    right: "CLICK! The lock pops open."
    miss: "{guess}? The lock stays shut. HINT: tap CASEBOOK and read the LOCK numbers, first to last."
    reveal: "The code is {answer}. Doña Luz turns the dials with you."

# ---------------------------------------------------------------------------
# DRAGON HOARD: story word problems (Common Core 3.OA.D.8, two-step problems)
# vars:   each letter is a [min, max] range of whole numbers
# where:  a rule the numbers must follow (optional)
# answer: the math that gives the answer
# level:  1 is easiest; the game moves up after 2 right in a row
# The question must fit in four lines on an iPhone. The bot playtest checks it
# with the longest numbers, so keep each one short.
dragon_hoard:
  piraguas:
    - level: 1
      vars: { a: [2, 4], b: [2, 5], c: [1, 4] }
      where: "a * b > c"
      text: "Don Tito had {a} trays with {b} piragua cups on each tray. {pet} knocked {c} cups over. How many cups are left?"
      hint: "First find how many cups there were: {a} groups of {b}. Then take away the {c} that fell."
      explain: "{a} x {b} = {a*b} cups. Take away {c}: {a*b} - {c} = {answer}."
      answer: "a * b - c"

    - level: 1
      vars: { a: [3, 9], b: [2, 9], c: [2, 6] }
      text: "Don Tito made {a} cherry piraguas and {b} lime ones. Then {sibling} ate {c}... of the napkins. Oops! How many piraguas are there in all?"
      hint: "The napkins don't count! Just add the cherry and the lime."
      explain: "{a} + {b} = {answer}. The napkins were a trick!"
      answer: "a + b"

    - level: 2
      vars: { a: [3, 6], b: [4, 9], c: [3, 12] }
      where: "a * b > c"
      text: "Don Tito had {a} rows of syrup bottles, {b} in each row. {pet} bumped the cart and {c} rolled away. How many bottles are left?"
      hint: "Rows times bottles in each row gives the total. Then subtract the ones that rolled away."
      explain: "{a} x {b} = {a*b}. Then {a*b} - {c} = {answer}."
      answer: "a * b - c"

    - level: 2
      vars: { a: [2, 5], b: [2, 4] }
      text: "Each piragua costs {a} dollars. You buy one for {hero}, one for {sibling}, and {b} more for Doña Luz's friends. How many dollars is that?"
      hint: "Count the piraguas first: 2 plus {b}. Then each one costs {a} dollars."
      explain: "2 + {b} = {b+2} piraguas. {b+2} x {a} = {answer} dollars."
      answer: "(2 + b) * a"

    - level: 3
      vars: { a: [4, 8], b: [6, 9], c: [2, 5] }
      text: "Don Tito filled {a} trays with {b} cups each. {pet} licked {c} cups, so those go in the trash. How many clean cups are left?"
      hint: "Find all the cups: {a} x {b}. Then take away the {c} licked ones."
      explain: "{a} x {b} = {a*b}. {a*b} - {c} = {answer}."
      answer: "a * b - c"

    - level: 3
      vars: { a: [3, 6], b: [3, 8] }
      where: "a * b <= 48"
      text: "Don Tito has {a*b} cups. He puts them into {a} equal stacks. How many cups are in each stack?"
      hint: "Share {a*b} cups into {a} equal groups. What times {a} makes {a*b}?"
      explain: "{a*b} ÷ {a} = {answer}, because {a} x {answer} = {a*b}."
      answer: "b"

  cannonballs:
    - level: 1
      vars: { a: [2, 4], b: [2, 5], c: [1, 4] }
      where: "a * b > c"
      text: "The cannonballs sit in {a} rows, with {b} in each row. {pet} rolls {c} of them away. How many are left in the rows?"
      hint: "First find how many there were: {a} rows of {b}. Then take away the {c} that rolled off."
      explain: "{a} x {b} = {a*b} cannonballs. Take away {c}: {a*b} - {c} = {answer}."
      answer: "a * b - c"

    - level: 1
      vars: { a: [3, 9], b: [2, 9], c: [2, 6] }
      text: "You count {a} cannons on the top wall and {b} on the wall below. {sibling} counts {c} seagulls. How many cannons in all?"
      hint: "Seagulls aren't cannons! Just add the top wall and the wall below."
      explain: "{a} + {b} = {answer}. The seagulls were a trick!"
      answer: "a + b"

    - level: 2
      vars: { a: [6, 9], b: [2, 5], c: [3, 9] }
      text: "Each level of the fort has {a} steps. You climb {b} levels, then {c} more steps to the sentry box. How many steps is that?"
      hint: "Find the steps for the levels first: {b} groups of {a}. Then add the last {c}."
      explain: "{b} x {a} = {a*b} steps. Then {a*b} + {c} = {answer}."
      answer: "a * b + c"

    - level: 2
      vars: { a: [3, 6], b: [4, 9], c: [3, 12] }
      where: "a * b > c"
      text: "{sibling} stacks {a} rows of cannonballs, {b} in each row. {pet} bumps the pile and {c} roll away. How many are left?"
      hint: "Rows times cannonballs in each row gives the total. Then subtract the ones that rolled away."
      explain: "{a} x {b} = {a*b}. Then {a*b} - {c} = {answer}."
      answer: "a * b - c"

    - level: 3
      vars: { a: [3, 6], b: [3, 8] }
      where: "a * b <= 48"
      text: "There are {a*b} cannonballs. You stack them in {a} equal piles. How many cannonballs are in each pile?"
      hint: "Share {a*b} cannonballs into {a} equal groups. What times {a} makes {a*b}?"
      explain: "{a*b} ÷ {a} = {answer}, because {a} x {answer} = {a*b}."
      answer: "b"

    - level: 3
      vars: { a: [4, 8], b: [6, 9], c: [2, 5] }
      text: "The fort wall has {a} lookout windows on each of {b} sides. {c} are bricked up. How many windows are still open?"
      hint: "Find all the windows: {a} x {b}. Then take away the {c} bricked-up ones."
      explain: "{a} x {b} = {a*b}. {a*b} - {c} = {answer}."
      answer: "a * b - c"

  # Yokahú Tower: 96 steps to the top
  tower:
    - level: 1
      vars: { a: [3, 9], b: [2, 9], c: [2, 5] }
      text: "You count {a} lizards on the way up and {b} on the way down. {sibling} counts {c} clouds. How many lizards in all?"
      hint: "Clouds aren't lizards! Just add the way up and the way down."
      explain: "{a} + {b} = {answer}. The clouds were a trick!"
      answer: "a + b"

    - level: 1
      vars: { a: [2, 4], b: [2, 5], c: [1, 3] }
      where: "a * b > c"
      text: "The tower has {a} windows on each of {b} floors. Vines cover {c} of them. How many windows can you see out of?"
      hint: "First find all the windows: {a} on each of {b} floors. Then take away the {c} with vines."
      explain: "{a} x {b} = {a*b} windows. Take away {c}: {a*b} - {c} = {answer}."
      answer: "a * b - c"

    - level: 2
      vars: { a: [6, 9], b: [3, 6], c: [3, 9] }
      text: "Each turn of the stairs has {a} steps. You climb {b} turns, then {c} more steps to the top. How many steps is that?"
      hint: "Find the steps for the turns first: {b} groups of {a}. Then add the last {c}."
      explain: "{b} x {a} = {a*b} steps. Then {a*b} + {c} = {answer}."
      answer: "a * b + c"

    - level: 2
      vars: { a: [3, 6], b: [4, 8], c: [2, 9] }
      where: "a * b > c"
      text: "{a} families are up on the tower, with {b} people in each. Then {c} people go back down. How many are still up top?"
      hint: "Families times people in each gives everyone. Then subtract the ones who left."
      explain: "{a} x {b} = {a*b}. Then {a*b} - {c} = {answer}."
      answer: "a * b - c"

    - level: 3
      vars: { a: [3, 6], b: [4, 8] }
      where: "a * b <= 48"
      text: "The tower stairs have {a*b} steps, in {a} equal turns. How many steps are in each turn?"
      hint: "Share {a*b} steps into {a} equal groups. What times {a} makes {a*b}?"
      explain: "{a*b} ÷ {a} = {answer}, because {a} x {answer} = {a*b}."
      answer: "b"

    - level: 3
      vars: { a: [4, 8], b: [6, 9], c: [2, 5] }
      text: "{pet} needs {a} rests on the way up, and {b} sniffs at every rest. Then {c} more sniffs at the top. How many sniffs?"
      hint: "Find the sniffs at the rests: {a} x {b}. Then add the {c} at the top."
      explain: "{a} x {b} = {a*b}. {a*b} + {c} = {answer}."
      answer: "a * b + c"

  # La Coca Falls, with Ranger Inés and her rain gauge
  falls:
    - level: 1
      vars: { a: [3, 9], b: [2, 9], c: [2, 5] }
      text: "Ranger Inés emptied {a} rain cups this morning and {b} after lunch. {pet} drank from {c} puddles. How many cups did she empty?"
      hint: "Puddles aren't cups! Just add the morning and the afternoon."
      explain: "{a} + {b} = {answer}. The puddles were a trick!"
      answer: "a + b"

    - level: 1
      vars: { a: [2, 4], b: [2, 5], c: [1, 3] }
      where: "a * b > c"
      text: "{a} hikers stop at the falls, and each one takes {b} photos. {c} photos come out blurry. How many photos are good?"
      hint: "First find all the photos: {a} groups of {b}. Then take away the {c} blurry ones."
      explain: "{a} x {b} = {a*b} photos. Take away {c}: {a*b} - {c} = {answer}."
      answer: "a * b - c"

    - level: 2
      vars: { a: [3, 6], b: [4, 9], c: [3, 12] }
      where: "a * b > c"
      text: "The trail has {a} little bridges with {b} planks on each. {c} planks are loose. How many planks are NOT loose?"
      hint: "Bridges times planks gives them all. Then subtract the loose ones."
      explain: "{a} x {b} = {a*b}. Then {a*b} - {c} = {answer}."
      answer: "a * b - c"

    - level: 2
      vars: { a: [6, 9], b: [2, 5], c: [3, 9] }
      text: "{b} tour vans bring {a} people each to see the falls. Then {c} more people walk up. How many people is that?"
      hint: "Find the people in the vans first: {b} groups of {a}. Then add the {c} who walked."
      explain: "{b} x {a} = {a*b} people. Then {a*b} + {c} = {answer}."
      answer: "a * b + c"

    - level: 3
      vars: { a: [3, 6], b: [4, 8] }
      where: "a * b <= 48"
      text: "Ranger Inés has {a*b} trail maps. She puts them in {a} equal stacks. How many maps are in each stack?"
      hint: "Share {a*b} maps into {a} equal groups. What times {a} makes {a*b}?"
      explain: "{a*b} ÷ {a} = {answer}, because {a} x {answer} = {a*b}."
      answer: "b"

    - level: 3
      vars: { a: [4, 8], b: [6, 9], c: [2, 5] }
      text: "{a} vans are parked at the falls, with {b} seats in each. {c} seats are empty. How many seats have someone in them?"
      hint: "Find all the seats: {a} x {b}. Then take away the {c} empty ones."
      explain: "{a} x {b} = {a*b}. {a*b} - {c} = {answer}."
      answer: "a * b - c"

# ---------------------------------------------------------------------------
# TRADING POST: money problems. Buy on a budget and count the change.
# Written the same way as DRAGON HOARD. Answers are whole dollars.
trading_post:
  piraguas:
    - level: 1
      vars: { a: [2, 4], b: [1, 3] }
      text: "You have $10. You buy a piragua for ${a} and a dog biscuit for {pet} for ${b}. How many dollars do you have left?"
      hint: "Add up what you spent: ${a} and ${b}. Then take that away from $10."
      explain: "{a} + {b} = {a+b} dollars spent. 10 - {a+b} = {answer}."
      answer: "10 - a - b"

    - level: 1
      vars: { a: [2, 5], b: [2, 4] }
      text: "A piragua costs ${a}. You buy one for you and one for {sibling}, and Doña Luz gives you ${b} to help. How many dollars do YOU pay?"
      hint: "Two piraguas cost {a} + {a}. Then take away the ${b} from Doña Luz."
      explain: "{a} + {a} = {a+a} dollars. {a+a} - {b} = {answer}."
      answer: "a + a - b"

    - level: 2
      vars: { a: [2, 4], b: [2, 4] }
      text: "Piraguas cost ${a} each. You buy {b} and pay with a $20 bill. How many dollars does Don Tito give back?"
      hint: "First find the price of {b} piraguas: {b} groups of {a}. Then take that away from 20."
      explain: "{b} x {a} = {a*b} dollars. 20 - {a*b} = {answer}."
      answer: "20 - a * b"

    - level: 2
      vars: { a: [3, 5], b: [2, 4], c: [1, 3] }
      text: "You buy {b} piraguas at ${a} each, and a ${c} coconut candy. How many dollars is that in all?"
      hint: "The piraguas first: {b} groups of {a}. Then add the candy."
      explain: "{b} x {a} = {a*b}. Then {a*b} + {c} = {answer}."
      answer: "a * b + c"

    - level: 3
      vars: { a: [2, 3], b: [2, 3], c: [1, 2], d: [2, 3] }
      text: "A piragua is ${a} and a candy is ${c}. You buy {b} piraguas and {d} candies and pay $20. How many dollars come back?"
      hint: "Piraguas: {b} x {a}. Candies: {d} x {c}. Add those, then take the sum away from 20."
      explain: "{a*b} + {c*d} = {a*b+c*d} dollars spent. 20 - {a*b+c*d} = {answer}."
      answer: "20 - a * b - c * d"

    - level: 3
      vars: { a: [3, 5], b: [2, 5], r: [1, 2] }
      text: "You have ${a*b+r}. Piraguas cost ${a} each. What is the MOST piraguas you can buy?"
      hint: "Count by {a}s until one more would be too much. The leftover dollars can't buy a whole one."
      explain: "{b} x {a} = {a*b}, and one more would cost {a*b+a}. So you can buy {answer}, with ${r} left."
      answer: "b"

# ---------------------------------------------------------------------------
# SUNSET CLOCK: time problems (Common Core 3.MD.A.1, time to the minute and
# elapsed time). Written like DRAGON HOARD, plus:
#   at:  the time it is now, in minutes. 2:35 is 2*60 + 35. Shown as {at}
#   end: a second time to show, as {end} (optional)
#   as:  time     the answer is a time, in minutes; he types it like 3:25
#        minutes  the answer is a count of minutes
# Keep every time between 1:00 and 12:59. Here q counts five-minute steps,
# so q*5 is the minutes past the hour.
sunset_clock:
  # the lantern tunnel at San Cristóbal
  tours:
    - level: 1
      vars: { h: [1, 4], q: [1, 6], d: [2, 5] }
      at: "h*60 + q*5"
      as: time
      text: "It's {at}. The ranger unlocks the tunnel gate in {d*5} minutes. What time will that be?"
      hint: "The hour stays {h}. Add {d*5} to the {q*5} minutes."
      explain: "{q*5} + {d*5} = {q*5+d*5} minutes, so it's {answer}."
      answer: "h*60 + q*5 + d*5"

    - level: 2
      vars: { h: [1, 4], q: [7, 11], d: [3, 9] }
      where: "q + d > 12"
      at: "h*60 + q*5"
      as: time
      text: "It's {at}. The lantern tour starts in {d*5} minutes. What time does it start?"
      hint: "From {at} it takes {60-q*5} minutes to reach {h+1}:00. How many of the {d*5} minutes are left?"
      explain: "{60-q*5} minutes gets you to {h+1}:00. {d*5} - {60-q*5} = {d*5+q*5-60} more: {answer}."
      answer: "h*60 + q*5 + d*5"

    - level: 3
      vars: { h: [1, 4], q: [5, 10], d: [4, 9] }
      where: "q + d > 12"
      at: "h*60 + q*5"
      end: "h*60 + q*5 + d*5"
      as: minutes
      text: "The lantern tour goes into the tunnel at {at} and comes out at {end}. How many minutes long is the tour?"
      hint: "Count from {at} up to {h+1}:00 first. Then add the minutes after {h+1}:00."
      explain: "{60-q*5} minutes to {h+1}:00, plus {q*5+d*5-60} more: {answer} minutes."
      answer: "d*5"

  # the top of Yokahú Tower
  clouds:
    - level: 1
      vars: { h: [1, 4], q: [1, 6], d: [2, 5] }
      at: "h*60 + q*5"
      as: time
      text: "It's {at}. The ranger says a rain cloud will get here in {d*5} minutes. What time will it rain?"
      hint: "The hour stays {h}. Add {d*5} to the {q*5} minutes."
      explain: "{q*5} + {d*5} = {q*5+d*5} minutes, so it's {answer}."
      answer: "h*60 + q*5 + d*5"

    - level: 2
      vars: { h: [1, 4], q: [7, 11], d: [3, 9] }
      where: "q + d > 12"
      at: "h*60 + q*5"
      as: time
      text: "It's {at}. The fog will lift in {d*5} minutes, and then you can see the sea. What time will that be?"
      hint: "From {at} it takes {60-q*5} minutes to reach {h+1}:00. How many of the {d*5} minutes are left?"
      explain: "{60-q*5} minutes gets you to {h+1}:00. {d*5} - {60-q*5} = {d*5+q*5-60} more: {answer}."
      answer: "h*60 + q*5 + d*5"

    - level: 3
      vars: { h: [1, 4], q: [5, 10], d: [4, 9] }
      where: "q + d > 12"
      at: "h*60 + q*5"
      end: "h*60 + q*5 + d*5"
      as: minutes
      text: "It started to rain at {at}. The sun came back at {end}. How many minutes did it rain?"
      hint: "Count from {at} up to {h+1}:00 first. Then add the minutes after {h+1}:00."
      explain: "{60-q*5} minutes to {h+1}:00, plus {q*5+d*5-60} more: {answer} minutes."
      answer: "d*5"

# ---------------------------------------------------------------------------
# STEPPING STONES: a row of numbers with a rule and one number missing
# (Common Core 3.OA.D.9, arithmetic patterns).
# rules: how rows are made, shared by every topic
#   step:    the jump between numbers; the game picks one from the list
#   times:   or each number is this many times the one before
#   start:   [min, max] for the first number
#   on_step: true makes the first number that many steps (3 steps of 5 is
#            15), so the row is plain skip-counting
#   gap:     end (the last number is missing) or middle
# Each topic is the story around the row. {stones} is the row, like
# "3, 6, 9, __, 15".
stepping_stones:
  rules:
    - { level: 1, step: [2, 5, 10], start: [1, 4], on_step: true, gap: end }
    - { level: 1, step: [2, 5, 10], start: [1, 4], on_step: true, gap: middle }
    - { level: 2, step: [3, 4, 6], start: [1, 4], on_step: true, gap: middle }
    - { level: 2, step: [-5, -10], start: [52, 98], gap: middle }
    - { level: 2, step: [3, 4], start: [1, 9], gap: end }
    - { level: 3, step: [7, 8, 9], start: [1, 9], gap: middle }
    - { level: 3, step: [-3, -4, -6], start: [40, 60], gap: middle }
    - { level: 3, times: 2, start: [1, 5], gap: end }
  cannonballs:
    text: "You stack the cannonballs in piles that follow a rule: {stones}. How many go in the empty pile?"
  lanterns:
    text: "Each lantern in the tunnel has a number, but one has rubbed off: {stones}. What number is missing?"
  stairs:
    text: "Some stairs have a number painted on them, but one is worn away: {stones}. What number is missing?"
  rocks:
    text: "Each rock in the stream has a number painted on it, but one is under water: {stones}. What number is missing?"

# ---------------------------------------------------------------------------
# SNACK MUNCHER: a tray of numbered treats and a rule. He taps every treat
# that fits, then the MUNCH! key (Common Core 3.OA.C.7 and 3.NBT.A.1).
# rules: which rules come up, shared by every topic
#   kind: multiple   of: the game picks one number from the list.
#                    upto: how far the multiples go (10 unless given)
#   kind: round      to: 10 or 100. target: [min, max] counts in steps of
#                    "to", so to: 10 with target: [2, 9] is 20, 30, ... 90
# Each topic is the story around the rule. {rule} reads like "are multiples
# of 4" or "round to 50 (nearest ten)".
snack_muncher:
  rules:
    - { level: 1, kind: multiple, of: [2, 5, 10] }
    - { level: 2, kind: multiple, of: [3, 4, 6] }
    - { level: 2, kind: round, to: 10, target: [2, 9] }
    - { level: 3, kind: multiple, of: [7, 8, 9] }
    - { level: 3, kind: round, to: 100, target: [2, 8] }
  trail:
    text: "{pet} won't cross without a snack. He eats only treats that {rule}. Tap each one he may eat."
  sand:
    text: "{pet} thinks shells are snacks. He eats only treats that {rule}. Tap each one he may eat."

# ---------------------------------------------------------------------------
# EGG CRATES: rows and columns, then sharing fairly (Common Core 3.OA.A.1 to
# 3.OA.A.3). The board is an empty tray, 5 rows of 6. He taps a square and
# the tray fills from the top-left corner down to it.
# rules: what is asked, shared by every topic
#   ask: build   make {r} rows of {c}
#        rows    there are {n}; make {r} equal rows (he finds how long)
#        cols    there are {n}; make rows of {c} (he finds how many rows)
#   rows: and cols: [min, max] for the answer. No more than 5 rows and 6 columns.
# Each topic has an icon: from pics/drawn.js and a sentence for each ask.
egg_crates:
  rules:
    - { level: 1, ask: build, rows: [2, 4], cols: [2, 5] }
    - { level: 2, ask: rows, rows: [2, 4], cols: [3, 6] }
    - { level: 3, ask: cols, rows: [3, 5], cols: [3, 6] }
  cannonballs:
    icon: cannonball
    build: "Set the cannonballs back on the rack in {r} rows of {c}."
    rows: "There are {n} cannonballs. Set them on the rack in {r} equal rows."
    cols: "There are {n} cannonballs. Set them on the rack in equal rows of {c}."
  shells:
    icon: shell
    build: "{sibling} wants his shells laid out in {r} rows of {c}."
    rows: "{sibling} found {n} shells. Lay them out in {r} equal rows."
    cols: "{sibling} found {n} shells. Lay them out in equal rows of {c}."

# ---------------------------------------------------------------------------
# DRAGON CENSUS: a picture graph where each picture stands for more than one
# (Common Core 3.MD.B.3). Three rows show; one is empty, and he fills it in.
# rules: what is asked, shared by every topic
#   ask: fill    the row's number is given
#        more    it has {d} more than {other}
#        fewer   it has {d} fewer than {other}
#        total   all three rows make {total}
#   scale: what one picture stands for; the game picks one from the list
# Each topic has rows: (the game shows three in a row, in this order), an
# icon: from pics/drawn.js, a key: for under the graph, and a sentence for
# each ask. A row holds up to 6 pictures.
dragon_census:
  rules:
    - { level: 1, ask: fill, scale: [2, 5] }
    - { level: 2, ask: more, scale: [5, 10] }
    - { level: 2, ask: fewer, scale: [5, 10] }
    - { level: 3, ask: total, scale: [5, 10] }
  # Ranger Inés's rain chart at La Coca Falls. The days are in Spanish:
  # Monday to Friday.
  rain:
    icon: drop
    rows: [LUNES, MARTES, MIÉRCOLES, JUEVES, VIERNES]
    key: "EACH DROP = {scale} MINUTES OF RAIN"
    fill: "It rained for {n} minutes on {row}. Each drop stands for {scale} minutes. Fill in the {row} row."
    more: "On {row} it rained {d} minutes MORE than on {other}. Each drop is {scale} minutes. Fill in {row}."
    fewer: "On {row} it rained {d} minutes LESS than on {other}. Each drop is {scale} minutes. Fill in {row}."
    total: "It rained {total} minutes in all. Each drop stands for {scale} minutes. Fill in the {row} row."
  # The ranger's count from the top of Yokahú Tower: frogs, lizards, birds.
  animals:
    icon: paw
    rows: [COQUÍS, LAGARTIJOS, PÁJAROS]
    key: "EACH PAW PRINT = {scale} ANIMALS"
    fill: "The ranger counted {n} {row} this week. Each paw print stands for {scale}. Fill in the {row} row."
    more: "She counted {d} MORE {row} than {other}. Each paw print stands for {scale}. Fill in {row}."
    fewer: "She counted {d} FEWER {row} than {other}. Each paw print stands for {scale}. Fill in {row}."
    total: "She counted {total} animals in all. Each paw print stands for {scale}. Fill in the {row} row."

# ---------------------------------------------------------------------------
# COLORES: Spanish words and sentences
# say: a sound-it-out hint, since the game has no speech
# f:   the word as it goes with "la puerta" (a door is a "la" word, so ROJO
#      becomes ROJA). Levels 2 and 3 use it.
# sizes: the two sizes a door can be, for levels 2 and 3
spanish:
  colors:
    - { es: ROJO,       f: ROJA,       en: RED,    hex: "#d23a32", say: ROH-hoh,       hint: "Think of a fire truck." }
    - { es: AZUL,       f: AZUL,       en: BLUE,   hex: "#2f6fd1", say: ah-SOOL,       hint: "Like the sky and the sea." }
    - { es: AMARILLO,   f: AMARILLA,   en: YELLOW, hex: "#f2c531", say: ah-mah-REE-yoh, hint: "The color of the sun." }
    - { es: VERDE,      f: VERDE,      en: GREEN,  hex: "#3f9e4a", say: BEHR-deh,      hint: "Like the leaves of a tree." }
    - { es: ROSADO,     f: ROSADA,     en: PINK,   hex: "#f08cb4", say: roh-SAH-doh,   hint: "Like a flamingo." }
    - { es: BLANCO,     f: BLANCA,     en: WHITE,  hex: "#f4f1e8", say: BLAHN-koh,     hint: "Like {pet}'s front paws." }
    - { es: ANARANJADO, f: ANARANJADA, en: ORANGE, hex: "#ec8a2c", say: ah-nah-rahn-HAH-doh, hint: "Like an orange, the fruit!" }
  sizes:
    - { es: GRANDE,  en: BIG,   size: big }
    - { es: PEQUEÑA, en: SMALL, size: small }

# ---------------------------------------------------------------------------
# HOLA Y GRACIAS: someone says something in Spanish, and he picks what to say
# back (grade 2). Each topic is a list of exchanges:
#   says / en:        what they say, and what it means
#   reply / reply_en: the right thing to say back, and what it means
# The wrong answers are the replies to the other lines, so no two lines in a
# topic may share a reply.
hola:
  street:
    - says: "¡Buenos días! ¿Cómo estás?"
      en: "Good morning! How are you?"
      reply: "Muy bien, gracias."
      reply_en: "Very well, thank you."
      hint: "¿CÓMO ESTÁS? asks how you ARE."
    - says: "¿Cómo te llamas?"
      en: "What is your name?"
      reply: "Me llamo {hero}."
      reply_en: "My name is {hero}."
      hint: "TE LLAMAS asks your NAME. Which answer has a name in it?"
    - says: "¡Muchas gracias!"
      en: "Thank you very much!"
      reply: "De nada."
      reply_en: "You're welcome."
      hint: "After GRACIAS, the polite answer means \"it was nothing.\""
    - says: "¿Qué buscas?"
      en: "What are you looking for?"
      reply: "Busco un dragón pequeño."
      reply_en: "I'm looking for a small dragon."
      hint: "BUSCAS and BUSCO are the same word: to LOOK FOR."
    - says: "¿Tienes sed?"
      en: "Are you thirsty?"
      reply: "Sí, tengo sed."
      reply_en: "Yes, I'm thirsty."
      hint: "TIENES asks if you HAVE it. TENGO says I HAVE it."
    - says: "¿Te gusta Puerto Rico?"
      en: "Do you like Puerto Rico?"
      reply: "Sí, me gusta mucho."
      reply_en: "Yes, I like it a lot."
      hint: "TE GUSTA asks if you LIKE it. ME GUSTA says I LIKE it."
    - says: "¡Hasta luego!"
      en: "See you later!"
      reply: "¡Adiós!"
      reply_en: "Goodbye!"
      hint: "HASTA LUEGO is what you say when you LEAVE."

  # a hiker on the trail at Juan Diego Falls
  trail:
    - says: "¿Adónde vas?"
      en: "Where are you going?"
      reply: "Voy a la cascada."
      reply_en: "I'm going to the waterfall."
      hint: "ADÓNDE asks WHERE. VOY means I GO."
    - says: "¿Tienes hambre?"
      en: "Are you hungry?"
      reply: "Sí, tengo hambre."
      reply_en: "Yes, I'm hungry."
      hint: "TIENES asks if you HAVE it. TENGO says I HAVE it."
    - says: "¡Cuidado! El camino está mojado."
      en: "Careful! The path is wet."
      reply: "Gracias. Camino despacio."
      reply_en: "Thank you. I'm walking slowly."
      hint: "CUIDADO means CAREFUL. DESPACIO means SLOWLY."
    - says: "¿Hace calor hoy?"
      en: "Is it hot today?"
      reply: "Sí, hace mucho calor."
      reply_en: "Yes, it's very hot."
      hint: "CALOR means HEAT. Look for the same word in the answer."
    - says: "¿Oyes el coquí?"
      en: "Do you hear the coquí?"
      reply: "Sí, canta muy fuerte."
      reply_en: "Yes, it sings very loudly."
      hint: "OYES asks if you HEAR. CANTA means it SINGS."
    - says: "¿Es tu perro?"
      en: "Is that your dog?"
      reply: "Sí, se llama {pet}."
      reply_en: "Yes, his name is {pet}."
      hint: "PERRO means DOG. SE LLAMA tells a NAME."

# ---------------------------------------------------------------------------
# MEMORIA: a matching game. Each pair is a Spanish word and its picture.
#   es / en: the word, and what it means
#   icon:    its picture, from pics/drawn.js
# A topic needs at least 6 pairs, and no two may share a word or a picture.
# Level 1 is 3 pairs with the English under each word; level 2 is 4 pairs;
# level 3 is 6. Keep each word to two short lines so it fits on its card.
memoria:
  animals:
    - { es: LA RANA,       en: the frog,   icon: frog }
    - { es: EL LORO,       en: the parrot, icon: parrot }
    - { es: EL MURCIÉLAGO, en: the bat,    icon: bat }
    - { es: LA IGUANA,     en: the iguana, icon: iguana }
    - { es: LA CULEBRA,    en: the snake,  icon: snake }
    - { es: EL PERRO,      en: the dog,    icon: dog }
    - { es: EL GATO,       en: the cat,    icon: cat }
    - { es: EL PEZ,        en: the fish,   icon: fish }
  beach:
    - { es: EL SOL,      en: the sun,       icon: sun }
    - { es: EL MAR,      en: the sea,       icon: wave }
    - { es: LA TORTUGA,  en: the turtle,    icon: turtle }
    - { es: LA CONCHA,   en: the shell,     icon: shell }
    - { es: EL PEZ,      en: the fish,      icon: fish }
    - { es: LA PALMA,    en: the palm tree, icon: palm }
    - { es: EL CANGREJO, en: the crab,      icon: crab }
    - { es: EL BARCO,    en: the boat,      icon: boat }

# ---------------------------------------------------------------------------
# THE RESCUE: Spanish sentences for calling the hatchling (grade 2).
# A sentence with a goal: can be the right answer; goal: is what the hero
# wants, and it becomes the question. Every sentence can turn up as a wrong
# answer, and oops: says what the hatchling does when it hears it.
rescue:
  calls:
    - es: "Ven aquí, por favor."
      en: "Come here, please."
      goal: "The hatchling is scared. You want it to COME to you."
      hint: "VEN means COME. AQUÍ means HERE."
      oops: "It takes one step closer, then stops."
    - es: "Sube a la canasta."
      en: "Climb into the basket."
      goal: "The travel basket is open. You want the hatchling to CLIMB IN."
      hint: "SUBE means CLIMB UP. LA CANASTA is THE BASKET."
      oops: "It sniffs the basket and backs away."
    - es: "No tengas miedo."
      en: "Don't be afraid."
      goal: "The hatchling is shaking. You want to tell it NOT to be AFRAID."
      hint: "MIEDO means FEAR. NO TENGAS MIEDO: don't have fear."
      oops: "It blinks at you and stops shaking."
    - es: "Duerme ahora."
      en: "Sleep now."
      oops: "It yawns, curls up, and starts to snore."
    - es: "Vuela muy alto."
      en: "Fly very high."
      oops: "It flaps its tiny wings and loops up out of reach. Show-off."
    - es: "Corre muy rápido."
      en: "Run very fast."
      oops: "It zooms in a circle and hides again."

# ---------------------------------------------------------------------------
# FACT OR FIB: two real facts and one fib. Every fact needs a source.
# The game never shows the source. It's here so a grown-up can check each
# fact before release, and the bot playtest fails on a fact without one.
facts:
  iguana:
    - text: "Green iguanas aren't from Puerto Rico. They came as pets in the 1970s."
      source: "IUCN Iguana Specialist Group"
    - text: "People in Puerto Rico call the iguana gallina de palo: chicken of the trees."
      source: "Global Voices"
  forts:
    - text: "El Morro has six levels."
      source: "National Park Service"
    - text: "San Cristóbal is the biggest fort Spain built in the Americas."
      source: "National Park Service"
    - text: "People fly kites, called chiringas, on El Morro's big lawn."
      source: "National Parks Traveler"
  tunnel:
    - text: "Bats are Puerto Rico's only native land mammals."
      source: "U.S. Forest Service"
    - text: "Puerto Rico has 13 kinds of bats."
      source: "U.S. Forest Service"
    - text: "One sentry box at San Cristóbal is called the Devil's Sentry Box."
      source: "Wikipedia, Castillo San Cristóbal"
  rainforest:
    - text: "El Yunque is the only tropical rainforest in the U.S. National Forest System."
      source: "U.S. Forest Service"
    - text: "Yokahú Tower was built in 1963 so people could look out over the forest."
      source: "Wikipedia, Yokahú Tower"
  falls:
    - text: "The water at La Coca Falls drops 85 feet onto a huge rock formation."
      source: "U.S. Forest Service, La Coca Falls page"
    - text: "El Yunque gets about 120 inches of rain in a year."
      source: "U.S. Forest Service, El Yunque brochure"
    - text: "Only two kinds of coquí frog really sing co-kee."
      source: "U.S. Forest Service, coquí brochure"
  island:
    - text: "Baby coquí frogs skip the tadpole stage. They hatch as tiny froglets."
      source: "U.S. Forest Service, coquí brochure; eLife"
    - text: "The Puerto Rican boa is the island's biggest snake."
      source: "U.S. Fish and Wildlife Service"
    - text: "Puerto Rican anole lizards do push-ups to get attention."
      source: "UC Davis"
    - text: "In 1975, only 13 Puerto Rican parrots were left in the wild."
      source: "U.S. Fish and Wildlife Service, parrot recovery page; BirdsCaribbean"

fibs:
  iguana:
    - text: "Iguanas breathe fire to toast their lunch."
      hint: "Real lizards can't make fire. Only dragons in stories can!"
    - text: "Iguana eggs are as big as a soccer ball."
      hint: "An iguana is about as long as your arm. Could its egg be THAT big?"
    - text: "Iguanas grow up as tadpoles that swim in puddles."
      hint: "Tadpoles grow into frogs, not lizards."

  forts:
    - text: "El Morro was built in one afternoon."
      hint: "Thick stone walls take a very long time to build."
    - text: "El Morro floats, so it sails to a new island every year."
      hint: "Could a fort made of heavy stone float?"
    - text: "The fort's walls are made of hard candy."
      hint: "What would happen to candy walls in the rain?"

  tunnel:
    - text: "Bats are birds, with feathers under their fur."
      hint: "Bats have fur and feed their babies milk. What kind of animal does that?"
    - text: "The soldiers dug the tunnels with spoons, in one weekend."
      hint: "Long stone tunnels take years to dig."
    - text: "Bats sleep standing on one leg, like flamingos."
      hint: "Think about how a bat hangs when it sleeps."

  rainforest:
    - text: "It never rains in a rainforest."
      hint: "Read the name again: RAIN forest."
    - text: "Yokahú Tower is so tall that its top is in outer space."
      hint: "You can climb it in a few minutes. Could you climb to outer space?"
    - text: "The trees in El Yunque are made of green plastic."
      hint: "Real trees grow from seeds, with rain and sun."

  falls:
    - text: "At La Coca Falls the water flows UP the rocks."
      hint: "Which way does water always go on a hill?"
    - text: "The rangers turn the waterfall off every night."
      hint: "A waterfall is a stream going over rocks. Does a stream have a switch?"
    - text: "The water in La Coca Falls is lemonade."
      hint: "Rain fills the streams in a rainforest. Does it rain lemonade?"

# ---------------------------------------------------------------------------
# TUNES: note lists. Each note is NAME+OCTAVE, then :length in eighth notes.
# Use "-" for a rest. Example: "C5:1 E5:1 G5:2 -:1"
tunes:
  title:
    tempo: 150
    notes: "E4:1 A4:1 C5:1 E5:2 D5:1 C5:1 B4:2 G4:1 B4:1 D5:2 C5:1 B4:1 A4:4 -:1 E4:1 A4:1 C5:1 E5:2 G5:1 F5:1 E5:2 D5:1 C5:1 B4:1 G4:1 A4:6"
  ending:
    tempo: 140
    notes: "C5:1 E5:1 G5:1 C6:3 B5:1 G5:1 E5:1 G5:4 A5:1 F5:1 D5:1 F5:2 E5:1 C5:6"
  right:
    tempo: 320
    notes: "C5:1 E5:1 G5:1 C6:3"
  miss:
    tempo: 240
    notes: "E4:1 C4:3"
  find:
    tempo: 300
    notes: "G5:1 C6:1 E6:2"
  hatch:
    tempo: 260
    notes: "C5:1 D5:1 E5:1 G5:1 C6:1 E6:1 G6:3"
  click:
    tempo: 600
    notes: "E7:1 -:1 E7:1"
  # the two notes of a coquí's song, low then high
  co:
    tempo: 300
    notes: "D6:2"
  kee:
    tempo: 300
    notes: "C7:3"
  squawk:
    tempo: 520
    notes: "A4:1 F5:1 A4:1 G5:2"
  disk:
    tempo: 400
    notes: "A2:1 -:1 A2:1 B2:1 -:1 A2:1 A2:1 -:2 C3:4"
